/* ---- the keyboard: Outlook's chords (Ctrl+N, Ctrl+R, Ctrl+Shift+R, Ctrl+Q/U, Delete) and
   Gmail's letters, which Outlook's own web app also answers to */
function dpMailKeys(e){
  if(dpTyping(e)||e.altKey)return false;
  var rows=dpViewRows(DP.view), cur=DP.cursor, open=DP.view.thread, ctrl=e.ctrlKey||e.metaKey;
  var row=function(i){ return rows[i]; }, ids=function(){ var s=dpSelected(); return s.length?s:open?[open]:cur!=null&&row(cur)?[row(cur).id]:[]; };
  var move=function(d){ var n=cur==null?(d>0?0:rows.length-1):Math.max(0,Math.min(rows.length-1,cur+d)); if(!rows[n])return; DP.cursor=n;
    dpQA('.dp-row.cur').forEach(function(x){ x.classList.remove('cur'); }); var el=dpQ('.dp-row[data-id="'+rows[n].id+'"]'); if(el){ el.classList.add('cur'); el.scrollIntoView({block:'nearest'}); }
    if(open||!DP.narrow())dpOpenThread(rows[n].id); };
  if(ctrl){

    if(k==='e'||k==='f'&&!open){ var q=dpQ('#dpQ'); if(q){ q.focus(); q.select(); } }
    else if(k==='n')dpCompose({}); else if(k==='r'&&e.shiftKey&&open)dpReplyOpen('replyAll'); else if(k==='r'&&open)dpReplyOpen('reply'); else if(k==='f'&&open)dpReplyOpen('forward');
    else if(k==='q')dpMailAct('read',ids(),{silent:true}); else if(k==='u')dpMailAct('unread',ids(),{silent:true}); else if(k==='a'&&!e.shiftKey){ rows.forEach(function(r){ DP.sel[r.id]=1; }); dpRenderList(); }

    case 'j': case 'ArrowDown': if(e.key==='ArrowDown'&&e.target!==document.body&&!e.target.classList.contains('dp-row'))return false; move(1); break;
    case 'k': case 'ArrowUp': if(e.key==='ArrowUp'&&e.target!==document.body&&!e.target.classList.contains('dp-row'))return false; move(-1); break;
    case 'Enter': case 'o': if(cur!=null&&row(cur))dpOpenThread(row(cur).id); else return false; break;
    case 'x': if(cur!=null&&row(cur))dpSelect(row(cur).id,!DP.sel[row(cur).id]); break;
    case 'e': case 'y': if(DP.view.label!=='TRASH'&&DP.view.label!=='SPAM')dpMailAct('archive',ids()); break;
    case '#': case 'Delete': case 'Backspace': if(e.key!=='#'&&e.target!==document.body&&!e.target.classList.contains('dp-row'))return false; dpMailAct(DP.view.label==='TRASH'?'untrash':'trash',ids()); break;
    case 'u': if(open){ dpCloseThread(); } else dpMailAct('unread',ids(),{silent:true}); break;
    case 'U': dpMailAct('unread',ids(),{silent:true}); break;
    case 'I': dpMailAct('read',ids(),{silent:true}); break;
    case 's': case 'Insert': var t=ids()[0]; if(t)dpMailAct(DP.threads[t].starred?'unstar':'star',[t],{silent:true}); break;
    case '!': dpMailAct('spam',ids()); break;
    case 'c': case 'n': dpCompose({}); break;
    case 'r': if(open)dpReplyOpen('reply'); break;
    case 'a': if(open)dpReplyOpen('replyAll'); break;
    case 'f': if(open)dpReplyOpen('forward'); break;
    case 'v': case 'l': if(ids().length)dpLabelMenu(ids(),dpQ('#olRibbonBody .ol-bb')||dpQ('#dpListHead')); break;
    case '/': dpQ('#dpQ').focus(); dpQ('#dpQ').select(); break;
    case 'Escape': if(dpQA('.dp-menu').length)return false; if(dpSelected().length){ DP.sel={}; dpRenderList(); } else if(open)dpCloseThread(); else return false; break;
    case '?': dpShowShortcuts(); break;
    default: return false;
  }
  e.preventDefault(); return true;
}
function dpShowShortcuts(){
  var K=[['Ctrl+N','New message'],['Ctrl+E','Search'],['Ctrl+R / Ctrl+Shift+R','Reply / Reply all'],['Ctrl+F','Forward the open message'],['Delete','Delete'],['Ctrl+Q / Ctrl+U','Mark read / unread'],['Insert','Flag'],
    ['j / k','Next / previous conversation'],['Enter','Open'],['x','Select'],['e','Archive'],['v','Move to folder'],['!','Junk'],['g i','Inbox'],['Ctrl+Enter','Send'],['?','This list']];
  dpDialog('Keyboard shortcuts',dpEl('table.dp-keys',K.map(function(k){ return dpEl('tr',[dpEl('td',[dpEl('kbd',{text:k[0]})]),dpEl('td',{text:k[1]})]); })));
}

    dpEl('button.dp-btn',{type:'button',title:'Forward (Ctrl+F)',onclick:function(){ dpCompose({mode:'forward',msg:m}); }},[dpIcon('forward',16),'Forward']),

/* The body: inline pictures fetched and put in by their cid, the rest drawn inside the frame.
   Outside pictures are blocked until the person asks, the way Outlook does. */
async function dpDrawBody(body, m){
  var prefs=dpPrefs(), allow=prefs.images==='always'||!!DP.imgOk[m.from.email];
  dpClear(body);
  var html=m.html;
  if(html){
    var cids=Object.keys(m.inline||{});
    if(cids.length){ var got=await dpPool(cids,4,function(cid){ return dpCidData(m,cid); });
      cids.forEach(function(cid,i){ if(got[i]&&!got[i].error)html=html.split('cid:'+cid).join(got[i]); }); }
    var remote=/<img[^>]+src\s*=\s*["']?\s*(?:https?:)?\/\//i.test(html)||/url\(\s*["']?\s*https?:/i.test(html);

      dpEl('button.dp-link',{type:'button',text:'Download pictures',onclick:function(){ DP.imgOk[m.from.email]=1; dpDrawBody(body,m); }})]));
    var fr=dpEl('iframe.dp-frame',{sandbox:'allow-same-origin allow-popups allow-popups-to-escape-sandbox',title:'Message',scrolling:'no'});

    +'img{max-width:100%;height:auto}pre{white-space:pre-wrap}blockquote{margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex}table{max-width:100%}</style>';

    if(!d){ dpToast('That draft is no longer there.'); return; } dpCompose({mode:'draft',msg:m,draftId:d.id}); },

<script>

    w[key].forEach(function(a,i){ host.insertBefore(dpEl('span.dp-chip'+(dpValidEmail(a.email)?'':'.bad'),{title:a.email||a.name},[

<script>

   (trimmed) in IndexedDB with the triage verdict (triage.js), and read again only when it is
   new: a second pass costs the list and nothing else. Five at a time, which stays under Gmail's
   per-second quota with room for the folder being read at the same time. */

async function dpScanLoad(){

    });

<script>
/* Dispatch: the state, the boot and the router. Everything before this file defines functions;
   this one holds the one state object they share and runs. */
var DP_BUILD='362a5e9';
var DP={threads:{},msgs:{},lists:{},labels:[],sendAs:[],me:null,meSet:{},historyId:null,view:{mod:'mail',label:'INBOX',q:'',thread:null,msg:null,unread:false},sel:{},cursor:null,drag:null,
  syncing:false,loading:false,ready:false,authError:null,imgOk:{},cidCache:{},lastSync:0,lastChange:0,hashSelf:'',chord:'',ribbonTab:'home',fold:{cats:true},expanded:{},searchScope:'mailbox',offline:false,
  people:{q:'',sel:null,editing:false},tasks:{lists:[],listId:null,items:[],showDone:false,open:null,loading:false},
  cal:{date:new Date(),view:'month',cals:[],events:[],hidden:{},loading:false,key:'',q:''},contacts:null,others:null,peopleIdx:[],scan:null,scanItems:null,ai:null};
DP.narrow=function(){ return window.matchMedia('(max-width: 760px)').matches; };

function dpBoot(){
  dpApplyTheme();
  dpAuthHandleRedirect();
  var cfg=dpAuthConfig();
  if(!cfg.clientId){ dpShowSetup(); return; }
  if(!dpToken()){
    /* a known account with a token that ran out: one silent trip to Google first, and the
       sign-in screen only if that comes back refused (see auth.js) */
    if(DP.authError||!cfg.signedIn||Date.now()-(+(dpSession('dp.silentFail')||0))<600000)dpShowSignin();
    else if(!dpAuthStart({silent:true}))dpShowSignin();
    return;
  }
  if(!cfg.signedIn)dpSetAuthConfig(Object.assign(cfg,{signedIn:1}));
  dpStart();
}
async function dpStart(){
  dpShowOnly('dpApp'); olLayout();
  await dpLoadCache();
  dpMeSet();
  /* a cached account paints from disk at once; a first run waits the one round trip for the
     profile, so the rows it then fetches already know which address is "me" */
  var cached=!!(DP.me&&DP.me.email);
  if(cached)dpRoute();
  try{
    var p=await dpGmProfile();
    DP.me=Object.assign(DP.me||{},{email:p.emailAddress,name:(DP.me&&DP.me.name)||''});
    if(!DP.historyId){ DP.historyId=p.historyId; dpDbPut('meta','historyId',p.historyId); }
    var labels=await dpGmLabels(); var old={}; DP.labels.forEach(function(l){ old[l.id]=l; });
    DP.labels=labels.map(function(l){ return Object.assign({},old[l.id]||{},l); }); dpDbPut('meta','labels',DP.labels);
    try{ DP.sendAs=await dpGmSendAs(); var d=DP.sendAs.find(function(s){ return s.isDefault; }); if(d&&d.displayName)DP.me.name=d.displayName; dpDbPut('meta','sendAs',DP.sendAs); }catch(e){}
    dpDbPut('meta','me',DP.me); dpMeSet();
    var cfg=dpAuthConfig(); if(cfg.hint!==DP.me.email)dpSetAuthConfig(Object.assign(cfg,{hint:DP.me.email}));
  }catch(e){ if(e&&e.status!==401)dpToast(e.status===0?'Offline — showing what was cached.':'Google: '+e.message); }
  dpRenderFolders();
  if(!cached)dpRoute(); else if(DP.view.mod==='mail')dpRenderList();
  dpSync(); DP.lastSync=Date.now();
  setInterval(dpTick,15000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')dpTick(true); });
  window.addEventListener('online',function(){ olStatusUpdate(); dpSync(); });
  window.addEventListener('offline',olStatusUpdate);
  dpLoadPeople().catch(function(){});
  dpComposeRestore();
  dpCheckBuild(); setInterval(dpCheckBuild,600000);
  dpScanLoad().then(function(){ if(DP.view.mod==='dashboard')dpRenderDashboard(); if(dpScanStale())setTimeout(function(){ dpScanMailbox({quiet:true}); },4000); });
  DP.ready=true; try{ window.__dpReady=true; }catch(e){}
}
function dpMeSet(){ var s={}; if(DP.me&&DP.me.email)s[String(DP.me.email).toLowerCase()]=1; (DP.sendAs||[]).forEach(function(a){ if(a.sendAsEmail)s[String(a.sendAsEmail).toLowerCase()]=1; }); DP.meSet=s; }
function dpTick(now){

  if(now||Date.now()-DP.lastSync>dpPrefs().poll*1000){ DP.lastSync=Date.now(); dpSync(); }
}
function dpSyncState(on){ var b=dpQ('#olSync'); if(b)b.classList.toggle('spin',!!on); olStatusUpdate(); }
/* new mail in the Inbox since the last poll: a notification, if allowed */
function dpNotifyNew(ids, before){

  if(!fresh.length||!dpPrefs().notify||!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
  var r=DP.threads[fresh[0]], who=(r.people.filter(function(p){ return p.name!=='me'; })[0]||{}).name||'';
  try{ var n=new Notification(fresh.length>1?fresh.length+' new messages':(who||'New message'),{body:r.subject+(r.snippet?' — '+r.snippet:''),tag:'dispatch-new'});
    n.onclick=function(){ window.focus(); location.hash='#mail/INBOX/'+encodeURIComponent(r.id); n.close(); }; }catch(e){}
}
function dpCheckBuild(){
  if(typeof fetch!=='function')return;
  fetch('build.txt',{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){ t=String(t||'').trim();
    if(!/^[0-9a-f]{7}$/.test(t)||t===DP_BUILD||dpQ('#dpUpdate'))return;
    document.body.appendChild(dpEl('button#dpUpdate',{type:'button',title:'A newer build is on the server. Running '+DP_BUILD+'.',onclick:function(){ dpComposeBackup(); location.replace(location.pathname+'?_r='+Date.now().toString(36)+location.hash); }},
      [dpIcon('refresh',15),'New build — click to load'])); }).catch(function(){});
}

/* ---- the router: the hash is the view, so the back button and a bookmark both work */
function dpShowModule(mod){
  var secs={mail:'dpMail',calendar:'dpCal',people:'dpPeople',tasks:'dpTasks',dashboard:'dpDash'};
  Object.keys(secs).forEach(function(m){ var el=dpQ('#'+secs[m]); if(el)el.hidden=m!==mod; });
  var bs=dpQ('#olBackstage'); if(bs&&!bs.hidden&&mod!=='settings')bs.hidden=true;
  olNavUpdate(); olRenderRibbon(); olTitleUpdate(); olStatusUpdate();
  document.body.classList.remove('side-open');

function dpRoute(){
  if(DP.hashSelf&&location.hash===DP.hashSelf){ DP.hashSelf=''; return; } DP.hashSelf='';
  var parts=location.hash.replace(/^#/,'').split('/').map(function(s){ try{ return decodeURIComponent(s); }catch(e){ return s; } }), mod=parts[0]||'mail';
  if(mod==='mail'){ var un=parts[2]==='unread', off=un?1:0; dpOpenView({label:parts[1]||'INBOX',q:'',unread:un,thread:parts[2+off]||null,msg:parts[3+off]||null}); }
  else if(mod==='search'){ var un2=parts[2]==='unread', off2=un2?1:0; dpOpenView({label:'INBOX',q:parts[1]||'',unread:un2,thread:parts[2+off2]||null,msg:parts[3+off2]||null}); }
  else if(mod==='calendar'){ DP.view={mod:'calendar',sub:parts.slice(1).join('/')}; if(/^(month|week|workweek|day|agenda)$/.test(parts[1]||''))DP.cal.view=parts[1]; if(/^\d{4}-\d\d-\d\d$/.test(parts[2]||''))DP.cal.date=dpFromYmd(parts[2]);
    dpShowModule('calendar'); dpRenderFolders(); dpRenderCal(); dpLoadEvents(); }
  else if(mod==='people'){ DP.view={mod:'people'}; dpShowModule('people'); dpRenderFolders(); dpRenderPeople(); dpLoadPeople(); }
  else if(mod==='tasks'){ DP.view={mod:'tasks'}; if(parts[1])DP.tasks.listId=parts[1]; dpShowModule('tasks'); dpRenderFolders(); dpRenderTasks(); dpLoadTasks(); }
  else if(mod==='dashboard'){ DP.view={mod:'dashboard'}; dpShowModule('dashboard'); dpRenderFolders(); dpRenderDashboard(); }
  else if(mod==='settings'){ olBackstage('options'); }
  else location.replace('#mail/INBOX');
}
function dpKeys(e){
  if(e.key==='Escape'){ var bs=dpQ('#olBackstage'); if(bs&&!bs.hidden){ olBackstageClose(); return; } if(dpQA('.dp-menu').length){ dpQA('.dp-menu').forEach(function(m){ m.remove(); }); return; } }
  if(e.key==='F9'){ e.preventDefault(); dpSync(); return; }
  if(DP.view.mod==='mail'&&!dpTyping(e)&&!e.altKey){
    /* g then a letter: Gmail's "go to" chord */
    if(!e.ctrlKey&&!e.metaKey){
      if(DP.chord==='g'&&Date.now()-DP.chordAt<1500){ DP.chord=''; var go={i:'INBOX',s:'STARRED',t:'SENT',d:'DRAFT',a:'ALL'}[e.key]; if(go){ e.preventDefault(); location.hash='#mail/'+go; return; } }
      if(e.key==='g'){ DP.chord='g'; DP.chordAt=Date.now(); return; } }
    if(dpMailKeys(e))return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); var q=dpQ('#dpQ'); if(q)q.focus(); }
}
window.addEventListener('hashchange',dpRoute);
document.addEventListener('keydown',dpKeys);
document.addEventListener('DOMContentLoaded',function(){
  var mb=dpQ('#olMenuBtn'); if(mb)mb.onclick=function(){ document.body.classList.toggle('side-open'); };
  var sb=dpQ('#olSync'); if(sb)sb.onclick=function(){ dpSync(); };
  var sc=dpQ('#dpScrim'); if(sc)sc.onclick=function(){ document.body.classList.remove('side-open'); };
  var nm=dpQ('#olNavMore'); if(nm)nm.onclick=function(e){ dpMenu(e.currentTarget,[{label:'Dispatch Today (dashboard)',icon:'dash',run:function(){ location.hash='#dashboard'; }},{label:'Options…',icon:'settings',run:function(){ location.hash='#settings'; }},{label:'Keyboard shortcuts',icon:'list',run:dpShowShortcuts}]); };
  dpBoot();
});

</script>
