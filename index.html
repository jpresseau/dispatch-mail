     where it was clicked from. -->

<script>
/* The shared ⊕ Install button (src/shared/install.js). It floats bottom-right, which is where
   the compose windows dock, so it is shown on the File tab's backstage only - the one screen
   with that corner free, and the one a person reads when deciding to keep an app. */
window.__RCG_INSTALL_HOST='#olBackstage';
window.__RCG_INSTALL_NAME='Dispatch';
</script>
<script>/* THE ⊕ INSTALL BUTTON, shared by every app (v1978; the iOS half is v2049).

   TWO MODES, because two families of browser install in two different ways. Chromium hands the
   page an OFFER (beforeinstallprompt) it can consume on a press. Safari hands it nothing at all
   and installs from Share > "Add to Home Screen", so there the button is a signpost: it stays put
   and its press only says where to go. See the note beside `MANUAL` below - the whole button was
   gated on the offer until v2049, so on iOS it had never appeared.

   Lifted out of src/shared/refresh.js, which had carried it since v1705 and which only RC Garage
   and Solstice include. Brood Wars and First Light had a manifest and a service worker each and
   so were installable, but nothing ever offered it: the browser fires beforeinstallprompt, and
   with no listener the event is simply lost. Extracted rather than copied - a second
   implementation of this is how the three of them drift apart. (The Ledger keeps its own, because
   its button is a styled member of its toolbar rather than a floating one; this is about the apps
   that had no button at all.)

   WHY IT IS NOT ALWAYS ON SCREEN. The two games run full-screen and put controls in the corners -
   First Light's touch fire button is at right:18px bottom:22px, exactly where this used to float.
   So an app may name a HOST: a selector for an element that is on screen only when the game is
   not being played (its setup screen or its front door). The button then shows only while that
   element is visible, which is also the only moment anyone decides to install something. An app
   that names no host gets the old always-on behaviour, which is what RC Garage and Solstice want.

   Visibility is polled rather than observed, because both apps hide their screen with
   style.display and Brood Wars rebuilds the whole of #bw-menu's innerHTML on the way back to it -
   an observer on the host, or a button parented inside it, would not survive that. The button
   lives on <body> and only READS the host, twice a second, which is free.

   Set window.__RCG_INSTALL_HOST (a selector), window.__RCG_INSTALL_NAME (the app's name for the
   tooltip) and window.__RCG_INSTALL_ABOVE (a selector for what the app keeps in the bottom-right
   corner, which this is raised clear of) before this file runs. */
(function(){
  var HOST = null;
  try{ HOST = window.__RCG_INSTALL_HOST || null; }catch(_h){}
  /* v2051: an app names what it already keeps in this corner (RC Garage's "+ Add Part"), the way
     it names its HOST - a shared file may not know one app's ids. See CLAUDE.md. */
  var ABOVE = null;
  try{ ABOVE = window.__RCG_INSTALL_ABOVE || null; }catch(_v){}
  /* What to call the app in the tooltip, most specific first. rcgAppName() is src/shared/boot.js
     (it reads the apple-mobile-web-app-title meta) and is the right answer wherever it exists -
     but boot.js is RC Garage's and Solstice's, so the two games have neither it nor a meta tag,
     and say who they are outright. Resolved late rather than at load: on the pages that do have
     rcgAppName, this file can run before it. */
  function appName(){
    try{ if(window.__RCG_INSTALL_NAME)return window.__RCG_INSTALL_NAME; }catch(_a){}
    try{ if(typeof window.rcgAppName==='function')return window.rcgAppName(); }catch(_b){}
    try{ return document.title||'this app'; }catch(_c){ return 'this app'; }
  }

  /* Already running as the installed app - there is nothing left to offer. Covers a real
     installed window, iOS's own flag, and the ?app=1 desktop shortcut. */
  function appMode(){ try{
    return (window.matchMedia&&(matchMedia('(display-mode: standalone)').matches
            ||matchMedia('(display-mode: minimal-ui)').matches))
      ||window.navigator.standalone===true||/[?&]app=1(&|$)/.test(location.search);
  }catch(e){ return false; } }

  /* iOS SAFARI NEVER FIRES beforeinstallprompt (v2049), so on an iPhone or iPad the listener at
     the foot of this file is dead code and the button had NEVER ONCE APPEARED - on the one
     platform these four apps are mostly used from. Silently, which is this file's whole theme: a
     missed offer looks exactly like a browser that decided not to offer.
     Safari installs from Share > "Add to Home Screen" and gives a page no way at all to raise
     that sheet, so what an app CAN do is say where it is. The Ledger has done exactly that since
     it shipped (`if(iOS && !standalone()) showInstall()` in src/ledger/installed.js) and was the
     only one of the six that had - which is what "add an install button like my other apps have"
     meant.
     So the button has two modes. An OFFER is one it can consume: pressing it raises the browser's
     own dialog and the button then goes, because a used offer cannot be replayed. A MANUAL hint
     is one it can only point at: nothing is consumed, so the button STAYS - the press is the only
     way to read the instruction and someone who dismisses it must be able to ask again. */
  function iOS(){ try{
    return /iPad|iPhone|iPod/.test(navigator.userAgent||'')
      || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);   /* iPadOS 13+ lies */
  }catch(e){ return false; } }
  var MANUAL=iOS();

  var deferredPrompt=null, btn=null, watch=null, tip=null, tipT=0;

  /* getClientRects(), NOT offsetParent. offsetParent is null for a POSITION:FIXED element
     however visible it is, and First Light's front door is `position:fixed; inset:0` - so the
     first cut of this read its host as permanently hidden and the button never once appeared.
     Brood Wars' setup screen is in normal flow, which is exactly why that half looked fine.
     getClientRects() is empty for display:none and non-empty for a fixed element that is drawn. */
  function hostUp(){ if(!HOST)return true;
    try{ var el=document.querySelector(HOST); if(!el)return false;
      var cs=getComputedStyle(el);
      return cs.display!=='none' && cs.visibility!=='hidden' && el.getClientRects().length>0; }
    catch(_q){ return true; } }          /* a selector that cannot be read must not hide it */

  /* Pure, and idempotent as `_d3rpgGripLift` is (v2050): `btnBottomY+off` is the containing edge
     and does not move when the lift is applied. The base is a floor. */
  function _rcgInstallLift(btnBottomY,btnLeft,btnRight,off,obs,base,gap){
    if(!obs)return base;
    if(obs.right<=btnLeft||obs.left>=btnRight)return base;      /* not in this column */
    return Math.max(base,(btnBottomY+off)-obs.top+gap);
  }
  var GAP=10, tick=null;
  function fit(){
    if(!btn)return;
    try{
      if(btn._base==null){ var b0=parseFloat(getComputedStyle(btn).bottom); btn._base=isFinite(b0)?b0:16; }
      var o=null;
      if(ABOVE){ var el=document.querySelector(ABOVE);
        if(el&&getComputedStyle(el).display!=='none'&&el.getClientRects().length){
          var r=el.getBoundingClientRect(); if(r.height>0)o=r;
        } }
      var br=btn.getBoundingClientRect();
      var off=parseFloat(getComputedStyle(btn).bottom); if(!isFinite(off))off=btn._base;
      var want=_rcgInstallLift(br.bottom,br.left,br.right,off,o,btn._base,GAP);
      if(Math.abs(want-off)>0.5)btn.style.bottom=want+'px';
    }catch(_f){}
  }

  function make(){
    var b=document.createElement('button'); b.id='rcgAppInstall'; b.type='button';
    b.title=MANUAL&&!deferredPrompt ? 'Add '+appName()+' to your Home Screen'
                                    : 'Install '+appName()+' as a desktop app';
    b.setAttribute('aria-label',b.title);
    b.textContent='⊕';
    b.style.cssText='position:fixed;bottom:16px;right:16px;z-index:2147483000;width:46px;height:46px;'
      +'border-radius:50%;border:none;cursor:pointer;font:600 22px/46px system-ui,-apple-system,sans-serif;'
      +'text-align:center;color:#fff;background:#1D9E75;box-shadow:0 3px 12px rgba(0,0,0,.32);'
      +'opacity:.85;transition:opacity .2s;-webkit-tap-highlight-color:transparent';
    b.onmouseenter=function(){ b.style.opacity='1'; };
    b.onmouseleave=function(){ b.style.opacity='.85'; };
    b.onclick=function(){
      if(deferredPrompt){
        deferredPrompt.prompt();
        var p=deferredPrompt.userChoice; deferredPrompt=null;
        /* Gone either way: the browser will not replay a prompt that has been used, so a button
           still sitting there would do nothing on a second press. */
        (p&&p.then)?p.then(done,done):done();
        return;
      }
      /* No offer to consume - say where the install lives, and stay put. */
      if(MANUAL)showTip('Tap Share, then \u201cAdd to Home Screen\u201d');
    };
    return b;
  }
  /* Its own bubble rather than a toast. The shared toast lives in src/storage.js, which is RC
     Garage's and HighWall's - the two games have no toast of any kind - and this file exists
     precisely so that the four of them cannot drift apart. Anchored to the button it explains, so
     there is no doubt which control it is about.
     (Named without its brackets on purpose: a structure test counts calls to that function per
      page by pattern, and a mention in a comment reads to it as a call - install.js reaches
      First Light, which has no #toast, so writing it the other way turned that check red.) */
  function showTip(msg){
    hideTip();
    var t=document.createElement('div'); t.id='rcgAppInstallTip'; t.textContent=msg;
    t.style.cssText='position:fixed;bottom:70px;right:16px;z-index:2147483001;max-width:min(15rem,'
      +'calc(100vw - 32px));padding:9px 12px;border-radius:10px;cursor:pointer;'
      +'font:500 13px/1.35 system-ui,-apple-system,sans-serif;color:#fff;background:#20262b;'
      +'box-shadow:0 3px 14px rgba(0,0,0,.36);-webkit-tap-highlight-color:transparent';
    t.onclick=hideTip;
    (document.body||document.documentElement).appendChild(t); tip=t;
    tipT=setTimeout(hideTip,7000);
  }
  function hideTip(){ if(tipT){ clearTimeout(tipT); tipT=0; }
    if(tip){ tip.remove(); tip=null; } }

  function done(){ if(btn){ btn.remove(); btn=null; } hideTip(); stop(); }
  function stop(){ if(watch){ clearInterval(watch); watch=null; }
    if(tick){ clearInterval(tick); tick=null; } }

  function sync(){
    /* appMode() is what covers an ALREADY-INSTALLED iOS copy (navigator.standalone), so the
       manual button does not offer a Home Screen tile to someone reading this from one. */
    if((!deferredPrompt&&!MANUAL)||appMode()){ if(btn){btn.remove();btn=null;} hideTip(); return; }
    var want=hostUp();
    if(want&&!btn){ btn=make(); (document.body||document.documentElement).appendChild(btn); fit();
      /* re-checked: the occupant comes and goes with the view */
      if(ABOVE&&!tick)tick=setInterval(fit,500); }
    else if(!want&&btn){ btn.remove(); btn=null; hideTip(); }
  }

  /* The watch is no longer the offer's alone: a manual button is host-gated in exactly the same
     way, so both modes arm it. */
  function arm(){ sync(); if(HOST&&!watch)watch=setInterval(sync,500); }

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();                  /* or Chrome shows its own mini-infobar instead */
    deferredPrompt=e;
    if(btn){ btn.remove(); btn=null; }   /* re-made, because its words change with the mode */
    arm();
  });
  window.addEventListener('appinstalled',function(){ deferredPrompt=null; done(); });

  /* THE INSTRUMENT (v2049), permanent for the same reason `window.__rsTicks` is: "the rule is
     wrong" and "the poll has not run" look identical from outside, and everything in this file
     fails silently. Every field is a closure variable no test can otherwise reach. */
  try{ window.__rcgInstall=function(){
    var el=null,cs=null,r=null;
    try{ el=HOST?document.querySelector(HOST):null;
      if(el){ cs=getComputedStyle(el); r=el.getBoundingClientRect(); } }catch(_i){}
    return { manual:MANUAL, host:HOST, above:ABOVE, offer:!!deferredPrompt, appMode:appMode(),
      hostFound:!!el, hostUp:hostUp(), watching:!!watch, btn:!!btn,
      display:cs?cs.display:null, visibility:cs?cs.visibility:null,
      rects:el?el.getClientRects().length:0,
      box:r?[Math.round(r.width),Math.round(r.height)]:null };
  }; }catch(_x){}

  /* MANUAL needs no event, so it has to start itself - and this file runs in <head> on Brood
     Wars, where document.body does not exist yet. */
  if(MANUAL){
    if(document.body)arm();
    else document.addEventListener('DOMContentLoaded',arm,{once:true});
  }
})();
</script>
<style>
/* Dispatch: the frame, drawn the way classic Outlook (2016, the Colorful theme) draws it - a blue
   title bar, the ribbon's tab row on the same blue with a white active tab, a white ribbon body of
   grouped buttons with a label under each group, a white folder pane with the module words along
   its foot, the three panes, and a blue status bar. Segoe UI where it exists, the system's own
   sans otherwise. The old Outlook, not the new one: no rounded cards, no coloured accents but the
   one blue, 1 px lines everywhere. */
:root{
  --ol-blue:#0072C6;--ol-blue-dk:#005A9E;--ol-blue-lt:#CCE4F7;--ol-hover:#E5F3FF;--ol-sel:#CCE4F7;--ol-cur:#99CCF0;
  --ol-line:#D6D6D6;--ol-line2:#E8E8E8;--ol-ink:#212121;--ol-dim:#666666;--ol-dim2:#8A8A8A;--ol-bg:#FFFFFF;--ol-bg2:#F3F3F3;--ol-bg3:#FAFAFA;
  --ol-unread:#0072C6;--ol-flag:#C50F1F;--ol-warn:#FFF4CE;--ol-warn-ink:#5C4A00;--ol-crit:#FDE7E9;--ol-crit-ink:#A4262C;--ol-ok:#DFF6DD;--ol-ok-ink:#107C10;
  --ol-font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --ol-shadow:0 4px 14px rgba(0,0,0,.22);--row-h:66px;--list-w:400px;
}
:root[data-theme="dark"]{
  --ol-blue:#2B88D8;--ol-blue-dk:#1B6FB8;--ol-blue-lt:#1F3A52;--ol-hover:#2A3139;--ol-sel:#1F3A52;--ol-cur:#2F5578;
  --ol-line:#3A3A3A;--ol-line2:#2E2E2E;--ol-ink:#F0F0F0;--ol-dim:#A6A6A6;--ol-dim2:#8A8A8A;--ol-bg:#1F1F1F;--ol-bg2:#2B2B2B;--ol-bg3:#262626;
  --ol-unread:#4EA1FF;--ol-warn:#4A3F10;--ol-warn-ink:#F1D39A;--ol-crit:#4A1E22;--ol-crit-ink:#FF9AA2;--ol-ok:#1E3A1E;--ol-ok-ink:#8BD48B;
}
:root[data-density="compact"]{--row-h:48px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ol-bg2);color:var(--ol-ink);font:13.5px/1.35 var(--ol-font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--ol-blue)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  background:var(--ol-bg);border:1px solid #ABABAB;border-radius:0;padding:4px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[contenteditable]:focus-visible{outline:1px solid var(--ol-blue);outline-offset:0}
[hidden]{display:none !important}
.dp-dim{color:var(--ol-dim)}
.dp-mono{font-family:Consolas,ui-monospace,Menlo,monospace;font-size:12px}

kbd{font:600 11.5px Consolas,ui-monospace,Menlo,monospace;background:var(--ol-bg2);border:1px solid var(--ol-line);border-bottom-width:2px;padding:1px 5px}

/* ---- the frame */

.ol-sb svg{width:16px;height:16px;flex:0 0 auto}
.ol-ic{color:var(--ol-blue)} .ol-ic-red{color:#C50F1F} .ol-ic-purple{color:#7719AA} .ol-ic-green{color:#107C10} .ol-ic-amber{color:#D9A400} .ol-ic-grey{color:#6B6B6B}
#dpBody{flex:1;display:flex;min-height:0}
#dpSide{width:250px;flex:0 0 250px;background:var(--ol-bg);border-right:1px solid var(--ol-line);display:flex;flex-direction:column;min-height:0}
#dpSide.off{display:none}

/* ---- the folder pane */
.ol-fgroup{margin:2px 0 6px}
.ol-fghead{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;cursor:pointer;font-size:13px;color:var(--ol-ink);user-select:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.dp-calrow{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 26px;font-size:13px;cursor:pointer}
.dp-calrow:hover{background:var(--ol-hover)}
.dp-caldot{width:10px;height:10px;flex:0 0 auto}

/* ---- buttons, avatars, chips */
.dp-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid #ABABAB;background:var(--ol-bg2);cursor:pointer;color:var(--ol-ink);white-space:nowrap;text-decoration:none;font-size:13px}
.dp-btn:hover{background:var(--ol-hover);border-color:var(--ol-blue)}
.dp-btn.primary{background:var(--ol-blue);color:#fff;border-color:var(--ol-blue-dk)}
.dp-btn.primary:hover{background:var(--ol-blue-dk)}
.dp-btn:disabled{opacity:.5;cursor:default}
.dp-ib{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid transparent;background:none;color:var(--ol-dim);cursor:pointer;flex:0 0 auto}
.dp-ib:hover{background:var(--ol-hover);border-color:#A9D0F0;color:var(--ol-ink)}
.dp-ib.on{color:var(--ol-flag)}
.dp-ib.spin svg{animation:dp-spin 1s linear infinite}
@keyframes dp-spin{to{transform:rotate(360deg)}}
.dp-link{background:none;border:none;color:var(--ol-blue);cursor:pointer;padding:2px 4px}
.dp-ava{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;flex:0 0 auto;object-fit:cover}
.dp-ava.sm{width:24px;height:24px;font-size:10px}
.dp-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:0 6px;background:var(--ol-bg2);border:1px solid var(--ol-line);color:var(--ol-ink);font-size:12px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px}
.dp-chip.draft{color:var(--ol-flag);border-color:transparent;background:none;font-weight:600}
.dp-chip.bad{background:var(--ol-crit);color:var(--ol-crit-ink)}
.dp-chip button{border:none;background:none;cursor:pointer;padding:0 0 0 2px;font-size:13px;line-height:1;color:inherit}

/* ---- menus, dialogs, toasts */
.dp-menu{position:fixed;z-index:60;min-width:180px;max-height:70vh;overflow:auto;background:var(--ol-bg);border:1px solid #ABABAB;box-shadow:var(--ol-shadow);padding:2px}
.dp-menu hr{border:none;border-top:1px solid var(--ol-line);margin:3px 0}
.dp-mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 10px 5px 8px;border:1px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-size:12.5px}
.dp-mi:hover{background:var(--ol-hover);border-color:#A9D0F0}
.dp-mi svg{color:var(--ol-dim);flex:0 0 auto}
.dp-mi-gap{width:15px;flex:0 0 auto}
.dp-dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:16px}
.dp-dlgbox{background:var(--ol-bg);border:1px solid #6B6B6B;box-shadow:var(--ol-shadow);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column}
.dp-dlgbox.wide{width:min(780px,100%)}
.dp-dlgh{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 12px;background:var(--ol-blue);color:#fff}
.dp-dlgh h2{margin:0;font-size:13px;font-weight:400}
.dp-dlgh .dp-ib{color:#fff} .dp-dlgh .dp-ib:hover{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.dp-dlgc{padding:14px 16px;overflow:auto}
.dp-keys td{padding:3px 10px 3px 0}
#dpToast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:80;background:#3A3A3A;color:#fff;padding:7px 14px;box-shadow:var(--ol-shadow);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;display:flex;align-items:center;gap:14px;max-width:min(90vw,560px);font-size:12.5px}
#dpToast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dpToast button{background:none;border:none;color:#8EC5FF;font-weight:600;cursor:pointer;padding:0}
#dpUpdate{position:fixed;right:12px;bottom:32px;z-index:85;display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--ol-blue-dk);background:var(--ol-blue);color:#fff;cursor:pointer;box-shadow:var(--ol-shadow);font-size:12.5px}
.dp-frow{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.dp-frow>span{font-size:12px;color:var(--ol-dim)}
.dp-frow.inline{flex-direction:row;align-items:center;gap:8px}
.dp-frow.inline>span{font-size:inherit;color:inherit}
.dp-dt{display:flex;gap:6px;align-items:center}
.dp-cacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dp-tog{display:flex;align-items:center;gap:7px;cursor:pointer}
.dp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px 20px;color:var(--ol-dim);text-align:center}
.dp-rnone,.dp-rerr,.dp-rloading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;min-height:200px;color:var(--ol-dim);text-align:center;padding:20px}
.dp-rloading svg{animation:dp-spin 1s linear infinite}
.dp-warn{background:var(--ol-warn);color:var(--ol-warn-ink);padding:8px 10px;border:1px solid #E9D28E}

/* ---- the File tab's backstage */
#olBackstage{position:absolute;inset:0;z-index:50;display:flex;background:var(--ol-bg)}
.ol-bsnav{width:150px;flex:0 0 150px;background:var(--ol-blue);color:#fff;padding:0}
.ol-bsnav button{display:block;width:100%;text-align:left;border:none;background:none;color:#fff;padding:9px 20px;cursor:pointer;font-size:14px}
.ol-bsnav button:hover{background:rgba(255,255,255,.12)}
.ol-bsnav button.on{background:var(--ol-blue-dk)}
.ol-bsnav button.ol-bsback{font-size:22px;padding:8px 18px 12px}
.ol-bsbody{flex:1;overflow:auto;padding:22px 40px}
.ol-bsbody h1{font-weight:300;font-size:26px;margin:0 0 14px;color:var(--ol-ink)}
.ol-bsbody h2{font-size:15px;margin:18px 0 6px}
.ol-bscard{display:flex;gap:14px;align-items:center;padding:10px 0}

/* ---- a phone: the ribbon scrolls, the folder pane is a drawer, one pane at a time */
@media (max-width:760px){
  #olTitleText{position:static;flex:1;min-width:0;padding:0 8px;text-align:left}
  #olStatus{gap:10px;padding:0 6px}
  #olStatusL,#olStatusR{gap:10px}
  #olStatusR span:nth-child(2){display:none}
  #dpSide{position:fixed;top:0;bottom:24px;left:0;z-index:40;width:min(290px,85vw);transform:translateX(-105%);transition:transform .18s;box-shadow:var(--ol-shadow)}
  body.side-open #dpSide{transform:none}
  body.side-open #dpScrim{display:block;position:fixed;inset:0 0 24px;z-index:39;background:rgba(0,0,0,.3)}
  #dpSide.off{display:flex}
  .ol-tell{display:none}
  #olRibbonBody{min-height:76px}
}
@media (min-width:761px){ #olMenuBtn{display:none} }
@media print{ #olTitle,#olRibbon,#dpSide,#dpList,#olStatus,#dpComposeHost,#dpToast,.ol-racts{display:none !important} #dpRead,#dpMain,#dpApp,#dpBody{overflow:visible !important;height:auto !important;display:block !important} .dp-frame{height:auto !important} }

/* Dispatch: the mail module as classic Outlook lays it out - the message list with its search
   box and All/Unread filter, three-line items, a conversation that opens its messages under it,
   the reading pane with the subject over the sender's row and Reply / Reply All / Forward at the
   right, and the compose window. */
#dpMail{display:flex;min-height:0}
#dpList{width:var(--list-w);flex:0 0 var(--list-w);border-right:1px solid var(--ol-line);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ol-bg)}
#dpListHead{flex:0 0 auto;border-bottom:1px solid var(--ol-line)}
.ol-search{display:flex;align-items:center;gap:4px;padding:6px 8px 4px}
.ol-sbox{flex:1;display:flex;align-items:center;border:1px solid #ABABAB;background:var(--ol-bg);height:26px;padding:0 4px 0 6px;min-width:0}
.ol-sbox:focus-within{border-color:var(--ol-blue)}
#dpQ{flex:1;width:100%;border:none;background:none;padding:0;min-width:0;font-size:13px}
#dpQ::placeholder{color:var(--ol-dim2)}
.ol-sbox button{border:none;background:none;color:var(--ol-blue);cursor:pointer;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ol-scope{height:26px;border:1px solid #ABABAB;background:var(--ol-bg);padding:0 6px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;color:var(--ol-ink)}
.ol-filter{display:flex;align-items:center;gap:2px;padding:2px 8px 4px;font-size:12.5px}
.ol-fl{border:none;background:none;color:var(--ol-ink);padding:2px 8px;cursor:pointer}
.ol-fl.on{color:var(--ol-blue);font-weight:700;border-bottom:2px solid var(--ol-blue)}
.ol-sort{margin-left:auto;display:flex;gap:4px}
.ol-sort button{border:none;background:none;color:var(--ol-ink);cursor:pointer;padding:2px 6px;font-size:12px;white-space:nowrap}
.ol-sort button:hover{background:var(--ol-hover)}
.dp-selall{display:none}
#dpRows{flex:1;overflow:auto;overscroll-behavior:contain;min-height:0}
.dp-row{position:relative;display:flex;align-items:flex-start;gap:0;min-height:var(--row-h);padding:6px 10px 6px 14px;border-bottom:1px solid var(--ol-line2);cursor:default;user-select:none;background:var(--ol-bg)}
.dp-row:hover{background:var(--ol-hover)}
.dp-row.cur{background:var(--ol-hover);box-shadow:inset 0 0 0 1px #A9D0F0}
.dp-row.sel,.dp-row.open{background:var(--ol-sel)}
.dp-row.open.cur{background:var(--ol-cur)}
.dp-row.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ol-unread)}
.dp-row.unread .dp-from{font-weight:700}
.dp-row.unread .dp-subj{color:var(--ol-unread);font-weight:600}
.dp-row.unread .dp-date{color:var(--ol-unread);font-weight:600}
.dp-rchk{display:none}
.dp-row .dp-ava{display:none}
:root[data-density="compact"] .dp-row{padding:3px 10px 3px 14px}
:root[data-density="compact"] .dp-l3{display:none}
.dp-rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.dp-l1,.dp-l2,.dp-l3{display:flex;align-items:center;gap:6px;min-width:0}
.dp-from{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.dp-date{flex:0 0 auto;font-size:12px;color:var(--ol-dim)}
.dp-subj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ol-ink)}
.dp-snip{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ol-dim)}
.dp-flag{color:var(--ol-dim);display:inline-flex}
.dp-row.has-cv{padding-left:22px}
.ol-cvcaret{position:absolute;left:7px;top:8px;width:12px;font-size:9px;line-height:16px;color:var(--ol-dim);cursor:pointer;border:none;background:none;padding:0}
.dp-star{border:none;background:none;color:var(--ol-dim2);cursor:pointer;padding:1px;display:inline-flex;opacity:0}
.dp-row:hover .dp-star,.dp-star.on{opacity:1}
.dp-star.on{color:var(--ol-flag)}
.dp-rhov{display:none}
.dp-sub{display:flex;align-items:flex-start;gap:6px;padding:5px 10px 5px 34px;border-bottom:1px solid var(--ol-line2);background:var(--ol-bg3);cursor:default;font-size:12.5px;min-height:46px}
.dp-sub:hover{background:var(--ol-hover)}
.dp-sub.open{background:var(--ol-sel)}
.dp-sub.unread .dp-from{font-weight:700}
.dp-sub .dp-rmain{gap:0}
.dp-more{display:block;width:calc(100% - 20px);margin:10px;padding:6px;border:1px solid #ABABAB;background:var(--ol-bg2);cursor:pointer;font-size:12.5px}
.dp-more:hover{background:var(--ol-hover)}
#dpMail.pane-bottom{flex-direction:column}
#dpMail.pane-bottom #dpList{width:100%;flex:1 1 50%;border-right:none;border-bottom:1px solid var(--ol-line)}
#dpMail.pane-bottom #dpRead{flex:1 1 50%}
#dpMail.pane-off #dpList{width:100%;flex:1 1 auto;border-right:none}
#dpMail.pane-off #dpRead{display:none}

/* ---- the reading pane */
#dpRead{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;background:var(--ol-bg)}
.ol-rhead{padding:12px 18px 0;border-bottom:1px solid var(--ol-line);background:var(--ol-bg)}
.ol-rsubj{font-size:19px;font-weight:300;margin:0 0 10px;overflow-wrap:anywhere;color:var(--ol-ink);line-height:1.25}
.ol-rfrom{display:flex;align-items:flex-start;gap:10px}
.ol-rwho{flex:1;min-width:0;font-size:13px;padding-top:2px}
.ol-rwho b{font-size:13.5px}
.ol-rwho .dp-dim{font-size:12.5px}
.ol-rto{color:var(--ol-ink);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.ol-rto .lbl{display:inline-block;width:22px;color:var(--ol-dim)}
.ol-rright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.ol-racts{display:flex;gap:2px}
.ol-racts .dp-btn{background:none;border-color:transparent;padding:3px 8px;gap:5px;font-size:12.5px}
.ol-racts .dp-btn:hover{background:var(--ol-hover);border-color:#A9D0F0}
.ol-racts svg{color:#7719AA}
.ol-rdate{font-size:12.5px;color:var(--ol-ink);white-space:nowrap}
.ol-ratts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px 50px}
.ol-rinfo{background:var(--ol-warn);color:var(--ol-warn-ink);font-size:12.5px;padding:5px 10px;border-bottom:1px solid #E9D28E;display:flex;align-items:center;gap:8px}
.ol-rinfo.ok{background:var(--ol-ok);color:var(--ol-ok-ink);border-color:#B3E0B0}
.ol-rbody{padding:12px 18px 24px}
.ol-rmeta{padding:8px 18px;border-bottom:1px solid var(--ol-line);font-size:12.5px;color:var(--ol-dim);background:var(--ol-bg3)}
.dp-back{display:none}
.dp-frame{width:100%;border:none;display:block;min-height:40px;background:#fff}
.dp-plain{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.5}
.dp-plain .dp-q{color:var(--ol-dim)}
.dp-imgbar{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--ol-warn);color:var(--ol-warn-ink);padding:5px 10px;border:1px solid #E9D28E;margin:0 0 10px}
.dp-att{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--ol-line);background:var(--ol-bg2);cursor:pointer;max-width:100%;font-size:12.5px}
.dp-att:hover{background:var(--ol-hover)}
.dp-attn{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1000px){ :root{--list-w:330px} }
@media (max-width:760px){
  #dpList{width:100%;flex:1 1 auto;border:none}
  #dpRead{display:none}
  #dpMail.show-read #dpList{display:none}
  #dpMail.show-read #dpRead{display:flex}
  .dp-back{display:inline-flex}
  .ol-rfrom{flex-wrap:wrap}
  .ol-rright{align-items:flex-start;width:100%}
  .ol-ratts{padding-left:0}
}

/* ---- compose, the way an Outlook message window looks: a To / Cc / Subject block, a Send button
   at its left, the body under a thin line */
#dpComposeHost{position:fixed;right:0;bottom:24px;z-index:50;pointer-events:none}
.dp-cw{--slot:0;position:fixed;right:calc(12px + var(--slot) * 560px);bottom:24px;width:548px;max-width:calc(100vw - 24px);height:min(640px,calc(100vh - 60px));display:flex;flex-direction:column;background:var(--ol-bg);border:1px solid #6B6B6B;box-shadow:var(--ol-shadow);pointer-events:auto}
.dp-cw.min{height:30px;overflow:hidden}
.dp-cw.drop{outline:2px dashed var(--ol-blue);outline-offset:-4px}
.dp-cwh{display:flex;align-items:center;gap:2px;padding:0 2px 0 10px;background:var(--ol-blue);color:#fff;height:30px;flex:0 0 30px;font-size:12.5px}
.dp-cwh .dp-ib{color:#fff;width:28px;height:26px} .dp-cwh .dp-ib:hover{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.dp-cwtitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-cwspace{flex:1}
.dp-cwt{display:flex;align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--ol-line);flex-wrap:wrap;background:var(--ol-bg2)}
.dp-cwf{padding:2px 10px 0 8px;border-bottom:1px solid var(--ol-line);display:flex;gap:8px}
.dp-cwsend{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.dp-send.dp-btn{flex-direction:column;gap:2px;padding:8px 12px;height:auto;min-width:60px}
.dp-send svg{width:26px;height:26px}
.dp-cwrows{flex:1;min-width:0}
.dp-cwrow{display:flex;align-items:center;gap:8px;min-height:30px}
.dp-cwrow>label{width:60px;flex:0 0 60px;color:var(--ol-ink);font-size:12.5px}
.dp-cwrow>label.btnish{border:1px solid #ABABAB;background:var(--ol-bg2);text-align:center;height:22px;line-height:20px}
.dp-cwrow input.dp-subj,.dp-cwrow select{flex:1;border:none;border-bottom:1px solid var(--ol-line2);background:none;padding:4px 2px}
.dp-cwlinks{display:flex;gap:2px}
.dp-chips{flex:1;display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:3px 0;position:relative;min-width:0;border-bottom:1px solid var(--ol-line2)}
.dp-chipin{flex:1;min-width:110px;border:none;background:none;padding:3px 2px}
.dp-sugg{position:absolute;left:0;top:100%;z-index:5;min-width:260px;max-width:100%;background:var(--ol-bg);border:1px solid #ABABAB;box-shadow:var(--ol-shadow);padding:2px;max-height:260px;overflow:auto}
.dp-sg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:4px 8px;cursor:pointer}
.dp-sg:hover,.dp-sg.hi{background:var(--ol-hover);border-color:#A9D0F0}
.dp-sgn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-cwb{flex:1;overflow:auto;padding:12px 14px;outline:none;font-size:14px;line-height:1.45;min-height:80px;overflow-wrap:anywhere;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.dp-cwb blockquote{margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex}
.dp-cwa{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 6px}
.dp-cwa .dp-att{cursor:default;padding:2px 8px}
.dp-cwa .dp-att button{border:none;background:none;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;color:var(--ol-dim)}
.dp-cwtools{display:flex;gap:1px;align-items:center}
.dp-tb{width:26px;height:24px;border:1px solid transparent;background:none;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ol-ink)}
.dp-tb:hover{background:var(--ol-hover);border-color:#A9D0F0}
.dp-cwstatus{font-size:12px;color:var(--ol-dim);white-space:nowrap;margin-left:auto}
@media (max-width:760px){
  .dp-cw{right:0 !important;left:0;width:100%;max-width:100%;height:calc(100% - 24px);top:0}
  .dp-cw.min{top:auto;height:30px}
  .dp-cwtools .dp-tb:nth-child(n+6){display:none}
}

/* Dispatch: the calendar, People, Tasks, the dashboard (drawn like Outlook Today), Settings
   (the File tab's Options page) and the two setup screens, all in the classic Outlook look. */
/* ---- setup and sign-in */
#dpSetup,#dpSignin{height:100%;overflow:auto;display:flex;justify-content:center;padding:28px 16px;background:var(--ol-bg2)}
.dp-setup{max-width:720px;width:100%;background:var(--ol-bg);border:1px solid var(--ol-line);padding:26px 30px 22px;align-self:flex-start;margin:auto 0}
.dp-setup.narrow{max-width:460px}
.dp-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;color:var(--ol-blue);margin-bottom:12px}
.dp-setup h1{font-size:20px;font-weight:300;line-height:1.3;margin:0 0 12px}
.dp-setup p{line-height:1.5}
.dp-steps{padding-left:22px;line-height:1.5}
.dp-steps li{margin-bottom:11px}
.dp-steps li>b{display:block;margin-bottom:2px}
.dp-steps input{width:100%;margin-top:4px}
.dp-fine{font-size:12px;margin-top:16px}

/* ---- the calendar */
#dpCal{flex-direction:column;overflow:hidden}
.dp-calhead{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--ol-line);flex-wrap:wrap}
.dp-calhead h2{margin:0 8px;font-size:18px;font-weight:300;flex:1;min-width:0;white-space:nowrap}
.dp-calhead .dp-btn{padding:2px 10px}
.dp-seg{display:none}
.ol-calsearch{display:flex;align-items:center;border:1px solid #ABABAB;height:26px;padding:0 6px;gap:6px;width:220px;max-width:40%}

/* Dispatch: the wire format. Gmail hands a message over as a tree of parts with base64url
   bodies, and takes one back as an RFC 2822 text. Everything here is pure - no DOM, no fetch -

/* ---- base64, both alphabets. The API's bodies are base64url (-_ and no padding); MIME wants

   btoa on a raw string would throw on the first accent. */

    if(ls.indexOf('STARRED')>=0)row.starred=true;
    if(ls.indexOf('DRAFT')>=0)row.draft=true;
    if(/^multipart\/mixed/i.test(m.payload&&m.payload.mimeType||''))row.att=true;
    if(!row.subject)row.subject=dpDecodeWord(dpHeader(hs,'Subject'));
    if(+m.internalDate>=row.date){ row.date=+m.internalDate; row.snippet=dpDecodeEntities(m.snippet||''); }
    var f=dpAddrList(hs,'From')[0];
    row.msgs.push({id:m.id,from:f||{name:'',email:''},date:+m.internalDate||0,snippet:dpDecodeEntities(m.snippet||''),unread:ls.indexOf('UNREAD')>=0,draft:ls.indexOf('DRAFT')>=0});
    if(f){ var key=f.email||f.name; var mine=me&&me[f.email];
      if(!seen[key]){ seen[key]=1; row.people.push({name:mine?'me':(f.name||f.email.split('@')[0]),email:f.email,unread:ls.indexOf('UNREAD')>=0}); }
      else if(ls.indexOf('UNREAD')>=0){ row.people.forEach(function(p){ if(p.email===f.email)p.unread=true; }); } }
    dpAddrList(hs,'To').forEach(function(a){ if(!row.to.some(function(x){ return x.email===a.email; }))row.to.push(a); });
  });
  if(!row.subject)row.subject='(no subject)';
  return row;
}

/* ---- the text a message says, out of its html: the plain-text half of what we send, and the
   fallback for a message that came as html only. */
function dpDecodeEntities(s){
  var m={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' ',copy:'©',reg:'®',hellip:'…',mdash:'—',ndash:'–',rsquo:'’',lsquo:'‘',rdquo:'”',ldquo:'“'};
  return String(s==null?'':s).replace(/&(#x?[0-9a-f]+|[a-z]+);/gi,function(w,e){
    if(e[0]==='#'){ var n=/^#x/i.test(e)?parseInt(e.slice(2),16):parseInt(e.slice(1),10); return isNaN(n)?w:String.fromCodePoint(n); }
    return m[e.toLowerCase()]!=null?m[e.toLowerCase()]:w; });
}
function dpHtmlToText(html){
  var s=String(html||'');
  s=s.replace(/<(style|script|head|title)[\s\S]*?<\/\1>/gi,'').replace(/<!--[\s\S]*?-->/g,'');
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|tr|h[1-6]|blockquote|pre|table)>/gi,'\n').replace(/<li[^>]*>/gi,'• ').replace(/<\/t[dh]>/gi,'\t');
  s=s.replace(/<a\s[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi,function(_,h,t){ t=t.replace(/<[^>]+>/g,'').trim(); return t&&t!==h&&!/^(mailto:|#)/.test(h)?t+' ('+h+')':t||h; });
  s=dpDecodeEntities(s.replace(/<[^>]+>/g,''));
  return s.replace(/\r/g,'').replace(/[ \t ]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function dpTextToHtml(t){ return '<div>'+dpEsc(t).replace(/\n/g,'<br>')+'</div>'; }

/* ---- replies and forwards: who, what subject, and the quote under the cursor. */
function dpReplySubject(s, kind){
  var base=String(s||'').replace(/^\s*(?:(?:re|fwd?|fw|aw|wg|sv|vs)\s*:\s*)+/i,'').trim();
  return (kind==='forward'?'Fwd: ':'Re: ')+base;
}
/* `me` is {email:1,...}. Reply goes to Reply-To or From - unless I sent it, in which case it goes
   back to whoever I sent it to. Reply-all adds the rest, with myself and duplicates taken out. */
function dpReplyTargets(msg, me, all){
  me=me||{};
  var isMe=function(a){ return !!(a&&a.email&&me[a.email]); };
  var uniq=function(list,except){ var seen={}; (except||[]).forEach(function(a){ seen[a.email]=1; });
    return list.filter(function(a){ if(!a||!a.email||isMe(a)||seen[a.email])return false; seen[a.email]=1; return true; }); };
  var sender=(msg.replyTo&&msg.replyTo.length)?msg.replyTo:[msg.from];
  var to=isMe(msg.from)?(msg.to||[]).slice():sender.slice();
  to=uniq(to); if(!to.length&&isMe(msg.from))to=(msg.to||[]).slice(0,1);
  if(!all)return {to:to,cc:[]};
  var toAll=uniq(to.concat(msg.to||[])), cc=uniq(msg.cc||[],toAll);
  return {to:toAll,cc:cc};
}
function dpQuoteHtml(msg){
  var body=msg.html||dpTextToHtml(msg.text||'');
  return '<br><div class="dp-quote"><div>On '+dpEsc(dpFmtDateLong(msg.date))+', '+dpEsc(dpFmtAddr(msg.from))+' wrote:</div>'
    +'<blockquote style="margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex">'+body+'</blockquote></div>';
}
function dpForwardHtml(msg){
  var line=function(k,v){ return v?'<b>'+k+':</b> '+dpEsc(v)+'<br>':''; };
  return '<br><div class="dp-fwd">---------- Forwarded message ---------<br>'+line('From',dpFmtAddr(msg.from))
    +line('Date',dpFmtDateLong(msg.date))+line('Subject',msg.subject)+line('To',(msg.to||[]).map(dpFmtAddr).join(', '))
    +line('Cc',(msg.cc||[]).map(dpFmtAddr).join(', '))+'<br>'+(msg.html||dpTextToHtml(msg.text||''))+'</div>';
}

/* ---- out: one RFC 2822 text. Every body part is base64 and every header an encoded word where
   it needs one, so the result is seven-bit clean whatever was typed, and the multipart upload
   below can carry it as-is beside its JSON metadata. */
function dpBuildMime(o){
  var CRLF='\r\n', L=[];
  var addrs=function(list){ return (list||[]).map(dpFmtAddrMime).filter(Boolean).join(', '); };
  L.push('From: '+dpFmtAddrMime(o.from));
  if(o.to&&o.to.length)L.push('To: '+addrs(o.to));
  if(o.cc&&o.cc.length)L.push('Cc: '+addrs(o.cc));
  if(o.bcc&&o.bcc.length)L.push('Bcc: '+addrs(o.bcc));
  L.push('Subject: '+dpEncodeWord(o.subject||''));
  L.push('Date: '+new Date(o.date||Date.now()).toUTCString().replace(/GMT$/,'+0000'));
  L.push('MIME-Version: 1.0');
  if(o.inReplyTo)L.push('In-Reply-To: '+o.inReplyTo);
  if(o.references)L.push('References: '+o.references);
  var text=o.text||dpHtmlToText(o.html||''), html=o.html||'';
  var alt=(function(){ var b='alt_'+dpBoundary();
    var p=['Content-Type: multipart/alternative; boundary="'+b+'"','','--'+b,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',dpWrap76(dpB64Encode(text))];
    if(html)p.push('--'+b,'Content-Type: text/html; charset="UTF-8"','Content-Transfer-Encoding: base64','',dpWrap76(dpB64Encode(html)));
    p.push('--'+b+'--'); return p; })();
  var atts=o.atts||[];
  if(!atts.length)return L.concat(alt).join(CRLF)+CRLF;
  var b='mix_'+dpBoundary();
  L.push('Content-Type: multipart/mixed; boundary="'+b+'"','','--'+b);
  L=L.concat(alt);
  atts.forEach(function(a){ var n=dpEncodeWord(a.name||'file').replace(/"/g,'');
    L.push('--'+b,'Content-Type: '+(a.mime||'application/octet-stream')+'; name="'+n+'"','Content-Transfer-Encoding: base64',
      'Content-Disposition: attachment; filename="'+n+'"','',dpWrap76(a.b64||'')); });
  L.push('--'+b+'--');
  return L.join(CRLF)+CRLF;
}
/* The upload endpoint's multipart/related body: the JSON (a threadId, say) and the message. */
function dpUploadBody(meta, raw){
  var b='dpu_'+dpBoundary();
  return {type:'multipart/related; boundary="'+b+'"',
    body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta||{})+'\r\n--'+b+'\r\nContent-Type: message/rfc822\r\n\r\n'+raw+'\r\n--'+b+'--'};
}

</script>
<script>
/* Dispatch: signing in. GitHub Pages is a static host, so there is nowhere to keep a client
   secret and no server to exchange a code: the app uses OAuth 2.0's implicit grant, a full-page
   trip to accounts.google.com that comes back with the access token in the URL fragment. A
   top-level redirect (rather than Google's popup token client) is deliberate - a popup from an
   installed iPhone app opens Safari and never comes back, and the token model's silent renewal
   needs third-party cookies, which no phone browser allows any more. The fragment is read once,
   stored, and wiped off the address bar before anything else runs.

   The OAuth client id is the owner's own: made once in Google Cloud and pasted into the setup
   screen (settings.js), kept in localStorage under dp.config. It is not a secret - every web
   client id is public - and nothing here can be used without the owner's own Google sign-in. */
var DP_SCOPES=[
  'https://www.googleapis.com/auth/gmail.modify',            /* read, label, archive, trash, send, drafts */
  'https://www.googleapis.com/auth/gmail.settings.basic',    /* the signature and send-as aliases */
  'https://www.googleapis.com/auth/calendar.events',
  'https://www.googleapis.com/auth/calendar.readonly',       /* the list of calendars and their colours */
  'https://www.googleapis.com/auth/contacts',
  'https://www.googleapis.com/auth/contacts.other.readonly', /* the people you have written to, for autocomplete */
  'https://www.googleapis.com/auth/tasks'];

function dpAuthConfig(){ try{ return JSON.parse(localStorage.getItem('dp.config')||'{}')||{}; }catch(e){ return {}; } }
function dpSetAuthConfig(c){ try{ localStorage.setItem('dp.config',JSON.stringify(c||{})); }catch(e){} }
/* The address Google sends the token back to - this page, with no index.html and no fragment -
   which is also the one the owner registers in Google Cloud, so the setup screen prints it. */
function dpRedirectUri(){ return location.origin+location.pathname.replace(/index\.html$/,''); }
function dpAuthUrl(clientId, redirect, state, opts){
  opts=opts||{};
  var p={client_id:clientId,redirect_uri:redirect,response_type:'token',scope:DP_SCOPES.join(' '),state:state,include_granted_scopes:'true'};
  if(opts.prompt)p.prompt=opts.prompt;
  if(opts.hint)p.login_hint=opts.hint;
  return dpApiBase('auth')+'?'+Object.keys(p).map(function(k){ return k+'='+encodeURIComponent(p[k]); }).join('&');
}
/* The fragment Google comes back with, as an object - or null when the fragment is one of ours
   (#mail/INBOX) rather than Google's. */
function dpAuthParseHash(hash){
  hash=String(hash||'').replace(/^#/,'');
  if(!/(^|&)(access_token|error)=/.test(hash))return null;
  var o={}; hash.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i<0)return;
    try{ o[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); }catch(e){} });
  return o;
}
/* The token, if it has at least a quarter of a minute left; a request made on the last second of
   one is a 401 and a redirect in the middle of whatever was being done. */
function dpToken(){ try{ var t=JSON.parse(localStorage.getItem('dp.token')||'null'); return t&&t.token&&t.exp>Date.now()+15000?t:null; }catch(e){ return null; } }
function dpSetToken(t){ try{ if(t)localStorage.setItem('dp.token',JSON.stringify(t)); else localStorage.removeItem('dp.token'); }catch(e){} }
function dpSession(k,v){ try{ if(v===undefined)return sessionStorage.getItem(k); if(v===null)sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }

/* Off to Google. `silent` asks for a token with no screen (prompt=none): an hour-old session is
   renewed in one hop when the Google session is alive, and comes straight back with an error
   when it is not, which puts the sign-in screen up instead. Whatever was open - the route, the
   compose windows - is kept for the page that comes back. */
function dpAuthStart(opts){
  opts=opts||{};
  var cfg=dpAuthConfig(); if(!cfg.clientId)return false;
  var state=Math.random().toString(36).slice(2)+Date.now().toString(36);
  if(typeof dpComposeBackup==='function')dpComposeBackup();
  dpSession('dp.oauth',JSON.stringify({state:state,back:location.hash,silent:!!opts.silent,at:Date.now()}));
  location.assign(dpAuthUrl(cfg.clientId,dpRedirectUri(),state,{prompt:opts.silent?'none':(opts.consent?'consent':''),hint:cfg.hint||''}));
  return true;
}
/* On every load, before anything else: did we just come back from Google? */
function dpAuthHandleRedirect(){
  var h=dpAuthParseHash(location.hash); if(!h)return false;
  var pending=null; try{ pending=JSON.parse(dpSession('dp.oauth')||'null'); }catch(e){}
  dpSession('dp.oauth',null);
  var back=(pending&&pending.back&&!dpAuthParseHash(pending.back))?pending.back:'';
  try{ history.replaceState(null,'',location.pathname+location.search+back); }catch(e){ location.hash=back; }
  if(h.error){ DP.authError=h.error; if(pending&&pending.silent)dpSession('dp.silentFail',String(Date.now())); return true; }
  if(!pending||pending.state!==h.state){ DP.authError='state_mismatch'; return true; }
  dpSetToken({token:h.access_token,exp:Date.now()+((+h.expires_in)||3600)*1000,scope:h.scope||''});
  dpSession('dp.silentFail',null);
  return true;
}
/* The token is gone or refused. Try a silent renewal once; a second failure inside ten minutes
   means the Google session itself is out, and that needs a person. */
var _dpRenewing=false;
function dpAuthRenew(){
  if(_dpRenewing)return; _dpRenewing=true;
  dpSetToken(null);
  var failed=+(dpSession('dp.silentFail')||0);
  if(Date.now()-failed<600000||!dpAuthStart({silent:true})){ _dpRenewing=false; dpShowSignin(); }
}
function dpAuthSignOut(){
  var t=null; try{ t=JSON.parse(localStorage.getItem('dp.token')||'null'); }catch(e){}
  var done=function(){ dpSetToken(null); dpSession('dp.silentFail',null);
    return (typeof dpDbClear==='function'?dpDbClear():Promise.resolve()).then(function(){ location.hash=''; location.reload(); }); };
  if(!t||!t.token)return done();
  return fetch(dpApiBase('revoke')+'?token='+encodeURIComponent(t.token),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'}})
    .catch(function(){}).then(done);
}

<script>
/* Dispatch: the four Google APIs, over fetch. One wrapper carries the bearer token, turns a 401
   into a renewal, waits out a 429 or a 5xx with backoff, and throws a DpApiError the UI can show.
   The endpoints are looked up through dpApiBase so the browser tests can stand a fake Google
   up on their own server (tools/test/e2e/dispatch.js) - the only seam, and the whole suite
   hangs off it. */
var DP_API_REAL={gmail:'https://gmail.googleapis.com/gmail/v1/users/me/',upload:'https://gmail.googleapis.com/upload/gmail/v1/users/me/',
  cal:'https://www.googleapis.com/calendar/v3/',people:'https://people.googleapis.com/v1/',tasks:'https://tasks.googleapis.com/tasks/v1/',
  revoke:'https://oauth2.googleapis.com/revoke',auth:'https://accounts.google.com/o/oauth2/v2/auth',anthropic:'https://api.anthropic.com/'};
function dpApiBase(k){ var o=null; try{ o=window.__DP_API_BASE; }catch(e){} return o?o+k+(/^(revoke|auth)$/.test(k)?'':'/'):DP_API_REAL[k]; }

function DpApiError(status, message, body){ this.name='DpApiError'; this.status=status; this.message=message; this.body=body; }
DpApiError.prototype=Object.create(Error.prototype);
function dpSleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function dpQs(params){
  var out=[]; for(var k in (params||{})){ var v=params[k]; if(v==null||v==='')continue;
    (Array.isArray(v)?v:[v]).forEach(function(x){ out.push(encodeURIComponent(k)+'='+encodeURIComponent(x)); }); }
  return out.length?'?'+out.join('&'):'';
}
async function dpFetch(url, opts){
  opts=opts||{};
  var attempt=0;
  for(;;){
    var t=dpToken(); if(!t){ dpAuthRenew(); throw new DpApiError(401,'Signed out'); }
    var h={Authorization:'Bearer '+t.token};
    if(opts.json!==undefined)h['Content-Type']='application/json';
    if(opts.type)h['Content-Type']=opts.type;
    var method=opts.method||(opts.json!==undefined||opts.body?'POST':'GET'), r;
    try{ r=await fetch(url,{method:method,headers:h,body:opts.json!==undefined?JSON.stringify(opts.json):opts.body,signal:opts.signal}); }
    catch(e){ if(e&&e.name==='AbortError')throw e;
      if(attempt<2){ attempt++; await dpSleep(600*attempt); continue; } throw new DpApiError(0,'No connection: '+(e&&e.message||e)); }
    if(r.status===401){ dpAuthRenew(); throw new DpApiError(401,'Your sign-in has expired'); }
    if((r.status===429||r.status===403&&/rate|quota/i.test(await r.clone().text())||r.status>=500)&&attempt<4){
      attempt++; var ra=+(r.headers.get('Retry-After')||0);
      await dpSleep(ra?ra*1000:Math.min(8000,400*Math.pow(2,attempt))+Math.random()*250); continue; }
    if(r.status===204)return null;
    var txt=await r.text(), body=null; try{ body=txt?JSON.parse(txt):null; }catch(e){ body=txt; }
    if(!r.ok){ var msg=(body&&body.error&&(body.error.message||body.error.status))||r.statusText||('HTTP '+r.status);
      throw new DpApiError(r.status,msg,body); }
    return body;
  }
}
function dpGmail(path,params,opts){ return dpFetch(dpApiBase('gmail')+path+dpQs(params),opts); }
function dpCal(path,params,opts){ return dpFetch(dpApiBase('cal')+path+dpQs(params),opts); }
function dpPeople(path,params,opts){ return dpFetch(dpApiBase('people')+path+dpQs(params),opts); }
function dpTasksApi(path,params,opts){ return dpFetch(dpApiBase('tasks')+path+dpQs(params),opts); }
/* every page of a list endpoint, for the ones that are read whole (labels, calendars, contacts) */
async function dpAllPages(fn, key){
  var out=[], tok=null;
  for(var i=0;i<50;i++){ var r=await fn(tok); out=out.concat((r&&r[key])||[]); tok=r&&r.nextPageToken; if(!tok)break; }
  return out;
}

/* ---- Gmail */
function dpGmProfile(){ return dpGmail('profile'); }
function dpGmLabels(){ return dpGmail('labels').then(function(r){ return (r&&r.labels)||[]; }); }
function dpGmLabel(id){ return dpGmail('labels/'+encodeURIComponent(id)); }
function dpGmLabelPatch(id,body){ return dpGmail('labels/'+encodeURIComponent(id),null,{method:'PATCH',json:body}); }
function dpGmLabelDelete(id){ return dpGmail('labels/'+encodeURIComponent(id),null,{method:'DELETE'}); }
function dpGmMessagesList(p){ return dpGmail('messages',p); }
function dpGmMessageFull(id){ return dpGmail('messages/'+id,{format:'full'}); }

function dpGmThreadsList(p){ return dpGmail('threads',p); }

function dpGmModifyThread(id,add,remove){ return dpGmail('threads/'+id+'/modify',null,{json:{addLabelIds:add||[],removeLabelIds:remove||[]}}); }
function dpGmModifyMessage(id,add,remove){ return dpGmail('messages/'+id+'/modify',null,{json:{addLabelIds:add||[],removeLabelIds:remove||[]}}); }
function dpGmTrashThread(id){ return dpGmail('threads/'+id+'/trash',null,{method:'POST'}); }

function dpGmSendAs(){ return dpGmail('settings/sendAs').then(function(r){ return (r&&r.sendAs)||[]; }); }
/* Sending and drafts go through the upload endpoint: the JSON one caps a message at a few MB
   and this one at 35, which is the size of an email with a photo on it. */
function dpGmSendRaw(raw,threadId){ var u=dpUploadBody(threadId?{threadId:threadId}:{},raw);
  return dpFetch(dpApiBase('upload')+'messages/send?uploadType=multipart',{method:'POST',type:u.type,body:u.body}); }
function dpGmDraftSave(id,raw,threadId){ var u=dpUploadBody({message:threadId?{threadId:threadId}:{}},raw);
  return dpFetch(dpApiBase('upload')+'drafts'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PUT':'POST',type:u.type,body:u.body}); }
function dpGmDraftSend(id){ return dpGmail('drafts/send',null,{json:{id:id}}); }
function dpGmDraftDelete(id){ return dpGmail('drafts/'+id,null,{method:'DELETE'}); }
function dpGmDraftsList(){ return dpAllPages(function(tok){ return dpGmail('drafts',{maxResults:100,pageToken:tok}); },'drafts'); }

/* ---- Calendar */
function dpCalList(){ return dpAllPages(function(tok){ return dpCal('users/me/calendarList',{pageToken:tok}); },'items'); }
function dpCalEvents(calId,timeMin,timeMax){
  return dpAllPages(function(tok){ return dpCal('calendars/'+encodeURIComponent(calId)+'/events',
    {timeMin:timeMin,timeMax:timeMax,singleEvents:'true',orderBy:'startTime',maxResults:2500,pageToken:tok}); },'items');
}
function dpCalInsert(calId,ev,notify){ return dpCal('calendars/'+encodeURIComponent(calId)+'/events',{sendUpdates:notify?'all':'none'},{json:ev}); }
function dpCalPatch(calId,id,ev,notify){ return dpCal('calendars/'+encodeURIComponent(calId)+'/events/'+encodeURIComponent(id),{sendUpdates:notify?'all':'none'},{method:'PATCH',json:ev}); }
function dpCalDelete(calId,id,notify){ return dpCal('calendars/'+encodeURIComponent(calId)+'/events/'+encodeURIComponent(id),{sendUpdates:notify?'all':'none'},{method:'DELETE'}); }

/* ---- People */
var DP_PERSON_FIELDS='names,emailAddresses,phoneNumbers,organizations,photos,addresses,biographies';
function dpPeopleConnections(){ return dpAllPages(function(tok){ return dpPeople('people/me/connections',
  {personFields:DP_PERSON_FIELDS,pageSize:1000,sortOrder:'LAST_NAME_ASCENDING',pageToken:tok}); },'connections'); }
function dpPeopleOther(){ return dpAllPages(function(tok){ return dpPeople('otherContacts',{readMask:'names,emailAddresses',pageSize:1000,pageToken:tok}); },'otherContacts'); }
function dpPeopleCreate(p){ return dpPeople('people:createContact',{personFields:DP_PERSON_FIELDS},{json:p}); }

/* ---- Tasks */
function dpTaskLists(){ return dpAllPages(function(tok){ return dpTasksApi('users/@me/lists',{maxResults:100,pageToken:tok}); },'items'); }
function dpTaskListCreate(title){ return dpTasksApi('users/@me/lists',null,{json:{title:title}}); }
function dpTaskListDelete(id){ return dpTasksApi('users/@me/lists/'+encodeURIComponent(id),null,{method:'DELETE'}); }
function dpTasksIn(listId,showCompleted){ return dpAllPages(function(tok){ return dpTasksApi('lists/'+encodeURIComponent(listId)+'/tasks',
  {maxResults:100,showCompleted:showCompleted?'true':'false',showHidden:showCompleted?'true':'false',pageToken:tok}); },'items'); }
function dpTaskInsert(listId,t){ return dpTasksApi('lists/'+encodeURIComponent(listId)+'/tasks',null,{json:t}); }
function dpTaskPatch(listId,id,t){ return dpTasksApi('lists/'+encodeURIComponent(listId)+'/tasks/'+encodeURIComponent(id),null,{method:'PATCH',json:t}); }
function dpTaskDelete(listId,id){ return dpTasksApi('lists/'+encodeURIComponent(listId)+'/tasks/'+encodeURIComponent(id),null,{method:'DELETE'}); }

<script>
/* Dispatch: what the app keeps. IndexedDB holds the thread rows, the opened messages, each
   folder's page of ids and the sync cursor, so a reopen paints the inbox from disk before the
   network answers and a phone that lost its signal still reads what it had. Gmail's history
   feed (history.list) is the cursor: every poll asks "what changed since id N" for two quota
   units, and only the threads it names are fetched again. The whole origin shares one
   localStorage and one IndexedDB namespace with five other apps, so the database has its own
   name and nothing here touches theirs. */
var _dpDbP=null;
function dpDb(){
  if(_dpDbP)return _dpDbP;
  _dpDbP=new Promise(function(res,rej){
    var rq=indexedDB.open('dispatch',2);
    rq.onupgradeneeded=function(){ var db=rq.result;
      ['threads','messages','lists','meta','people','scan'].forEach(function(s){ if(!db.objectStoreNames.contains(s))db.createObjectStore(s); }); };
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error); };
  });
  _dpDbP.catch(function(){ _dpDbP=null; });
  return _dpDbP;
}
/* One transaction, one store, one callback; the callback returns a request (its result is the
   answer) or a value. A database that will not open is a cache miss, never a broken app. */
function dpDbOp(store, mode, fn){
  return dpDb().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(store,mode), r=fn(tx.objectStore(store));
    tx.oncomplete=function(){ res(r&&typeof r==='object'&&'result' in r?r.result:r); };
    tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
  }); }).catch(function(e){ try{ console.warn('dispatch: cache',e); }catch(_){ } return null; });
}
function dpDbGet(store,key){ return dpDbOp(store,'readonly',function(st){ return st.get(key); }); }
function dpDbGetMany(store,keys){ return dpDbOp(store,'readonly',function(st){ var out=[];
  keys.forEach(function(k,i){ var r=st.get(k); r.onsuccess=function(){ out[i]=r.result; }; }); return {get result(){ return out; }}; }); }
function dpDbPut(store,key,val){ return dpDbOp(store,'readwrite',function(st){ st.put(val,key); return true; }); }
function dpDbDel(store,key){ return dpDbOp(store,'readwrite',function(st){ st.delete(key); return true; }); }
function dpDbAll(store){ return dpDbOp(store,'readonly',function(st){ return st.getAll(); }).then(function(r){ return r||[]; }); }
function dpDbClear(){
  return (_dpDbP||Promise.resolve(null)).then(function(db){ if(db)db.close(); _dpDbP=null;
    return new Promise(function(res){ var rq=indexedDB.deleteDatabase('dispatch'); rq.onsuccess=rq.onerror=rq.onblocked=function(){ res(); }; }); });
}
/* The oldest rows go once a store is past its size; a cache that only grows is a phone that
   runs out of room on the one app that is supposed to be fast. */
function dpDbTrim(store,max){
  return dpDbOp(store,'readwrite',function(st){ var rq=st.openCursor(), rows=[];
    rq.onsuccess=function(){ var c=rq.result; if(!c){ if(rows.length>max){ rows.sort(function(a,b){ return a.at-b.at; });
        rows.slice(0,rows.length-max).forEach(function(r){ st.delete(r.key); }); } return; }
      rows.push({key:c.key,at:(c.value&&c.value.at)||0}); c.continue(); };
    return true; });
}

/* ---- thread rows, in memory and on disk */
function dpCacheThread(row){ row.at=Date.now(); DP.threads[row.id]=row; return dpDbPut('threads',row.id,row); }
async function dpLoadCache(){
  var rows=await dpDbAll('threads'); rows.forEach(function(r){ if(r&&r.id)DP.threads[r.id]=r; });
  var meta=await dpDbGetMany('meta',['historyId','labels','sendAs','me']);
  if(meta){ if(meta[0])DP.historyId=meta[0]; if(meta[1])DP.labels=meta[1]; if(meta[2])DP.sendAs=meta[2]; if(meta[3])DP.me=meta[3]; }
  dpDbTrim('threads',3000); dpDbTrim('messages',400); dpDbTrim('scan',4000);
}
/* Fetch the metadata of every thread in `list` ([{id, historyId}]) that the cache does not
   already hold at that history id; a thread the server no longer has leaves the cache. */
function dpHydrateThreads(list){
  var need=list.filter(function(t){ var c=DP.threads[t.id]; return !c||String(c.hid)!==String(t.historyId); });
  return dpPool(need,6,function(t){
    return dpGmThreadMeta(t.id).then(function(full){ return dpCacheThread(dpThreadRow(full,DP.meSet)); },
      function(e){ if(e&&e.status===404){ delete DP.threads[t.id]; dpDbDel('threads',t.id); } else throw e; });
  });
}

/* ---- a folder's page of ids. The key is the folder or the search; the value the ids in the
   server's order and the token of the page after. */
function dpListKey(v){ return (v.q?'Q:'+v.q:'L:'+(v.label||'INBOX'))+(v.unread?':U':''); }
/* Archive is Gmail's All Mail less the Inbox, which is what an Outlook Archive folder holds; the
   Unread filter rides along as a query beside the label, which Gmail allows */
function dpListParams(v){
  var p={maxResults:50};
  if(v.q){ p.q=v.q; if(/\b(in:(spam|trash|anywhere)|label:(spam|trash))\b/i.test(v.q))p.includeSpamTrash='true'; }
  else if(v.label==='ALL')p.q='-in:inbox';
  else if(v.label){ p.labelIds=[v.label]; if(/^(SPAM|TRASH)$/.test(v.label))p.includeSpamTrash='true'; }
  if(v.unread)p.q=((p.q||'')+' is:unread').trim();
  return p;
}
async function dpLoadList(v, more){
  var key=dpListKey(v), cached=DP.lists[key];
  if(!cached&&!more){ cached=await dpDbGet('lists',key); if(cached)DP.lists[key]=cached; }
  var token=more?(cached&&cached.next):null;
  if(more&&!token)return cached;
  var r=await dpGmThreadsList(Object.assign(dpListParams(v),{pageToken:token}));
  var threads=(r&&r.threads)||[];
  await dpHydrateThreads(threads);
  var ids=threads.map(function(t){ return t.id; });
  if(more&&cached)ids=cached.ids.concat(ids.filter(function(id){ return cached.ids.indexOf(id)<0; }));
  var entry={ids:ids,next:(r&&r.nextPageToken)||null,at:Date.now()};
  DP.lists[key]=entry; dpDbPut('lists',key,entry);
  return entry;
}
/* The rows a view shows: the folder's ids, in order, minus what has left the folder since -
   an archived thread is gone from the inbox the moment the button is pressed, not after the
   next page fetch. */
function dpViewRows(v){
  var e=DP.lists[dpListKey(v)]; if(!e)return [];
  var out=e.ids.map(function(id){ return DP.threads[id]; }).filter(function(r){
    if(!r)return false; if(v.q)return true;
    if(v.label==='ALL')return !r.labels.TRASH&&!r.labels.SPAM&&!r.labels.INBOX;
    if(v.label==='DRAFT')return !!r.labels.DRAFT;
    return !!r.labels[v.label];
  });
  if(dpPrefs().oldest)out.reverse();
  return out;
}

/* ---- messages, the opened ones */
function dpCacheMessage(m){ m.at=Date.now(); DP.msgs[m.id]=m; return dpDbPut('messages',m.id,m); }
async function dpGetMessages(ids){
  var missing=ids.filter(function(id){ return !DP.msgs[id]; });
  if(missing.length){ var got=await dpDbGetMany('messages',missing); (got||[]).forEach(function(m){ if(m&&m.id)DP.msgs[m.id]=m; }); }
  return ids.map(function(id){ return DP.msgs[id]; });
}

/* ---- sync: what changed since the cursor, two quota units a poll */
async function dpSync(opts){
  opts=opts||{};
  if(DP.syncing)return; DP.syncing=true; dpSyncState(true);
  try{
    if(!DP.historyId||opts.full){ var p=await dpGmProfile(); DP.historyId=p.historyId; dpDbPut('meta','historyId',DP.historyId);
      await dpLoadList(DP.view,false); dpRenderList(); await dpRefreshCounts(); return; }
    var affected={}, added=false, tok=null, newest=DP.historyId, r;
    try{
      for(var i=0;i<20;i++){
        r=await dpGmHistory(DP.historyId,tok);
        (r.history||[]).forEach(function(h){
          ['messagesAdded','messagesDeleted','labelsAdded','labelsRemoved'].forEach(function(k){
            (h[k]||[]).forEach(function(x){ var m=x.message; if(m&&m.threadId){ affected[m.threadId]=1; if(k==='messagesAdded')added=true; } }); }); });
        if(r.historyId)newest=r.historyId; tok=r.nextPageToken; if(!tok)break;
      }
    }catch(e){
      /* a cursor older than the server keeps (404) starts over from the profile's */
      if(e&&e.status===404){ DP.historyId=null; DP.syncing=false; return dpSync({full:true}); }
      throw e;
    }
    DP.historyId=newest; dpDbPut('meta','historyId',newest);
    var ids=Object.keys(affected), before={};
    ids.forEach(function(id){ var r=DP.threads[id]; before[id]=!!(r&&r.unread&&r.labels.INBOX); });
    if(ids.length){
      await dpHydrateThreads(ids.map(function(id){ return {id:id,historyId:'?'}; }));
      if(added)await dpLoadList(DP.view,false);
      dpRenderList();
      if(DP.view.thread&&affected[DP.view.thread]&&typeof dpRefreshOpenThread==='function')dpRefreshOpenThread();
      DP.lastChange=Date.now(); if(typeof dpNotifyNew==='function')dpNotifyNew(ids,before);
    }
    await dpRefreshCounts();
  }catch(e){ if(!(e&&e.status===401))dpToast('Sync: '+(e&&e.message||e)); }
  finally{ DP.syncing=false; dpSyncState(false); }
}
/* The unread counts beside each folder: one unit a label, for the labels the sidebar shows. */
async function dpRefreshCounts(){
  var want=DP.labels.filter(function(l){ return l.type==='user'||/^(INBOX|DRAFT|SPAM|STARRED|SENT|TRASH|IMPORTANT|CATEGORY_)/.test(l.id); });
  await dpPool(want,8,function(l){ return dpGmLabel(l.id).then(function(full){
    l.unread=full.threadsUnread||0; l.total=full.threadsTotal||0; l.munread=full.messagesUnread||0; },function(){}); });
  dpDbPut('meta','labels',DP.labels);
  if(typeof dpRenderFolders==='function')dpRenderFolders();
  if(typeof olStatusUpdate==='function')olStatusUpdate();  /* the status bar's Items/Unread read these counts too */
}

/* ---- the things done to a thread, with the undo each one is */
var DP_OPS={
  archive:{add:[],remove:['INBOX'],inv:'inbox',msg:'Archived'},
  inbox:{add:['INBOX'],remove:['SPAM','TRASH'],inv:'archive',msg:'Moved to Inbox'},
  trash:{api:'trash',add:['TRASH'],remove:['INBOX'],inv:'untrash',msg:'Deleted'},
  untrash:{api:'untrash',add:[],remove:['TRASH'],inv:'trash',msg:'Restored'},
  spam:{add:['SPAM'],remove:['INBOX'],inv:'unspam',msg:'Reported as junk'},
  unspam:{add:['INBOX'],remove:['SPAM'],inv:'spam',msg:'Not junk'},
  read:{add:[],remove:['UNREAD'],inv:'unread',msg:'Marked as read'},
  unread:{add:['UNREAD'],remove:[],inv:'read',msg:'Marked as unread'},
  star:{add:['STARRED'],remove:[],inv:'unstar'},
  unstar:{add:[],remove:['STARRED'],inv:'star'}};
function dpApplyLabels(row, add, remove){
  if(!row)return; (remove||[]).forEach(function(l){ delete row.labels[l]; }); (add||[]).forEach(function(l){ row.labels[l]=1; });
  row.unread=!!row.labels.UNREAD; row.starred=!!row.labels.STARRED;

/* Applied locally first and sent after: the list answers at once, and a request that fails
   puts the labels back and says so. `op` is a name above or {add, remove, msg, inv}. */
async function dpDoOp(ids, op, opts){
  opts=opts||{}; var spec=typeof op==='string'?DP_OPS[op]:op;
  ids=ids.filter(function(id){ return DP.threads[id]; }); if(!ids.length)return;
  var before={}; ids.forEach(function(id){ before[id]=JSON.stringify(DP.threads[id].labels); dpApplyLabels(DP.threads[id],spec.add,spec.remove); });
  dpRenderList(); if(typeof dpRenderCountsLocal==='function')dpRenderCountsLocal();
  var res=await dpPool(ids,4,function(id){
    /* trash/untrash are Gmail's own calls, which move INBOX and TRASH themselves; any other label the op names goes by modify after */
    var call=spec.api==='trash'?dpGmTrashThread(id):spec.api==='untrash'?dpGmUntrashThread(id):Promise.resolve();
    var add=(spec.add||[]).filter(function(l){ return l!=='TRASH'; }), rem=(spec.remove||[]).filter(function(l){ return l!=='TRASH'&&!(spec.api==='trash'&&l==='INBOX'); });
    if(!spec.api||add.length||rem.length)call=call.then(function(){ return dpGmModifyThread(id,add,rem); });
    return call.then(function(){ return dpCacheThread(DP.threads[id]); }); });
  var failed=ids.filter(function(id,i){ return res[i]&&res[i].error; });
  if(failed.length){ failed.forEach(function(id){ DP.threads[id].labels=JSON.parse(before[id]); dpApplyLabels(DP.threads[id],[],[]); });
    dpRenderList(); var e=res[ids.indexOf(failed[0])].error; dpToast('Could not update '+failed.length+' conversation'+(failed.length>1?'s':'')+': '+(e&&e.message||e)); return; }
  if(!opts.silent&&spec.msg){
    /* Undo puts each conversation's labels back as they were, not merely the op's inverse: a deleted Inbox
       conversation gets its INBOX back, which untrash alone does not promise */
    var inv=typeof spec.inv==='string'?DP_OPS[spec.inv]:spec.inv;
    dpToast(spec.msg+(ids.length>1?' · '+ids.length+' conversations':''),inv?{label:'Undo',run:function(){ ids.forEach(function(id){ var was=JSON.parse(before[id]), now=DP.threads[id]?DP.threads[id].labels:{};
      var add=Object.keys(was).filter(function(l){ return !now[l]; }), rem=Object.keys(now).filter(function(l){ return !was[l]; });
      dpDoOp([id],{api:inv.api,add:add,remove:rem},{silent:true}); }); }}:null);
  }
  if(typeof dpRefreshCounts==='function')dpRefreshCounts();
}

var DP_MARKETS=/\b(ebay|etsy|aliexpress|temu|groupon|wayfair|overstock|shein|wish|poshmark|mercari|rakuten|honey|slickdeals|retailmenot)\b/i;

function dpTriageScore(rules, subj, from, text){
  var s=0, why=[];
  rules.forEach(function(r){ var re=r[0], w=r[1];
    if(re.test(subj)){ s+=w*2; why.push('subject: '+String(subj.match(re)[0]).toLowerCase()); }
    else if(re.test(from)){ s+=w*2; why.push('sender: '+String(from.match(re)[0]).toLowerCase()); }
    else if(re.test(text)){ s+=w; why.push(String(text.match(re)[0]).toLowerCase()); } });

/* The organisation a message speaks for: the sender's name, or the domain's own word. */
function dpTriageOrg(from){

/* Every date the text names, as [{at, text, near}]: "October 30, 2026", "Oct 30", "10/30/2026",
   "10/30", "30 October 2026", "2026-10-30", "Thursday, November 5", each with an optional time
   ("at 2:30 PM", "2:30pm", "14:30"). `near` is the forty characters before it, for the caller to
   tell a due date from a statement date. A year that is not written is the message's, or the
   next one when the day has already passed. */

  while((m=re1.exec(T)))push(m,m[3],DP_MONTHS[m[1].toLowerCase()],+m[2],m[4],m[5],m[6]);

  while((m=re2.exec(T)))push(m,m[3],DP_MONTHS[m[2].toLowerCase()],+m[1],m[4],m[5],m[6]);
  var re3=new RegExp('\\b(\\d{1,2})/(\\d{1,2})(?:/(\\d{4}|\\d{2}))?(?![\\d/])'+time,'gi');
  while((m=re3.exec(T)))push(m,m[3],+m[1]-1,+m[2],m[4],m[5],m[6]);

/* The amount a message is about: the one nearest a money word, else the largest. */

    var key=/(amount due|total due|payment due|balance due|minimum (payment )?due|total|amount|balance|due|payment|pay)/.test(near)?2:0;
    var cand={v:v,text:m[0],key:key};
    if(!best||cand.key>best.key||(cand.key===best.key&&cand.v>best.v))best=cand;
  }
  return best?{amount:best.v,text:best.text}:null;
}
/* The verdict. `m` is {subject, from:{name,email}, text, date, unsub, labels}; `now` pins the
   clock for the tests. */
function dpTriage(m, now){
  now=now==null?Date.now():+now;
  var subj=String(m.subject||''), from=(m.from&&(m.from.name+' '+m.from.email))||'', text=String(m.text||'').slice(0,8000);
  var best={cat:'other',score:0,why:[]};
  Object.keys(DP_TRIAGE).forEach(function(cat){ var r=dpTriageScore(DP_TRIAGE[cat],subj,from,text); if(r.score>best.score)best={cat:cat,score:r.score,why:r.why}; });
  var market=DP_MARKETS.test(from)||DP_MARKETS.test(subj);
  var strong=best.score>=6;
  var noise=best.cat==='noise'||(!!m.unsub&&!strong&&best.cat!=='security')||(market&&!strong)||(best.cat==='other'&&!!m.unsub)||(best.cat==='delivery'&&market);
  var out={id:m.id,threadId:m.threadId,date:+m.date||0,cat:noise?'noise':best.cat,score:best.score,why:best.why,noise:noise,
    org:dpTriageOrg(m.from),title:subj.replace(/^\s*((re|fwd?|fw)\s*:\s*)+/i,'').trim()||'(no subject)',when:null,whenText:'',amount:null,amountText:'',severity:'normal',unread:(m.labels||[]).indexOf('UNREAD')>=0,inbox:(m.labels||[]).indexOf('INBOX')>=0};
  if(noise)return out;
  var dates=dpTriageDates(subj+'\n'+text,m.date), amt=dpTriageAmount(subj+'\n'+text);
  if(amt){ out.amount=amt.amount; out.amountText=amt.text; }
  var pick=null;
  if(out.cat==='bill'){ pick=dates.find(function(d){ return /due|by|before|on or before|pay by|no later/.test(d.near); })||dates.find(function(d){ return d.at>=now-3*864e5; })||null; }
  else if(out.cat==='appointment'||out.cat==='official'){ pick=dates.find(function(d){ return d.at>=now-864e5&&(d.timed||/appointment|scheduled|visit|on|at|date/.test(d.near)); })||dates.find(function(d){ return d.at>=now-864e5; })||dates[dates.length-1]||null; }  /* a date already past says the visit is over */
  else pick=dates.find(function(d){ return d.at>=now-864e5; })||null;
  if(pick){ out.when=pick.at; out.whenText=pick.text; out.whenTimed=!!pick.timed; }
  var day=864e5, soon=out.when!=null?out.when-now:null;
  if(out.cat==='security')out.severity=/code\b/i.test(best.why.join(' '))&&best.score<=4?'normal':'critical';
  else if(out.cat==='bill'){ var bad=/past due|overdue|late fee|failed|declined|unsuccessful|returned|could not/i.test(subj+' '+text.slice(0,2000));
    out.severity=bad||(soon!=null&&soon<0)?'critical':(soon!=null&&soon<=7*day)?'high':'normal'; }
  else if(out.cat==='appointment')out.severity=soon!=null&&soon>=0&&soon<=2*day?'high':soon!=null&&soon<0?'low':'normal';
  else if(out.cat==='official')out.severity='high';
  else if(out.cat==='receipt'||out.cat==='delivery')out.severity='low';
  return out;
}
/* The dashboard's lists from a set of verdicts, newest first, each item once. */
function dpTriageSummary(items, now){
  now=now==null?Date.now():+now; var day=864e5;
  var seen={}, keep=[];
  items.slice().sort(function(a,b){ return b.date-a.date; }).forEach(function(it){
    if(it.noise)return; var k=it.cat+'|'+it.org.toLowerCase()+'|'+(it.amount!=null?it.amount:'')+'|'+(it.when!=null?Math.floor(it.when/day):it.title.toLowerCase().slice(0,40));
    if(seen[k])return; seen[k]=1; keep.push(it); });
  var sev={critical:0,high:1,normal:2,low:3};
  var by=function(a,b){ return sev[a.severity]-sev[b.severity]||(a.when!=null&&b.when!=null?a.when-b.when:b.date-a.date); };
  var alerts=keep.filter(function(i){ return (i.cat==='security'&&i.severity!=='normal')||i.severity==='critical'||i.cat==='official'; }).sort(by);  /* a one-time code is security, not an alarm */
  var appts=keep.filter(function(i){ return i.cat==='appointment'&&(i.when==null||i.when>=now-day); }).sort(function(a,b){ return (a.when||9e15)-(b.when||9e15); });
  var bills=keep.filter(function(i){ return i.cat==='bill'; }).sort(by);
  var receipts=keep.filter(function(i){ return i.cat==='receipt'; }).slice(0,8);
  var noise=items.filter(function(i){ return i.noise; }).length, other=items.filter(function(i){ return !i.noise&&i.cat==='other'; }).length;
  var due7=bills.filter(function(b){ return b.when!=null&&b.when>=now&&b.when-now<=7*day; }), overdue=bills.filter(function(b){ return b.severity==='critical'; });
  var sum=function(l){ return l.reduce(function(s,b){ return s+(b.amount||0); },0); };
  var money=function(v){ return '$'+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); };
  var parts=[];
  var sec=alerts.filter(function(a){ return a.cat==='security'; });
  if(sec.length)parts.push(sec.length+' security alert'+(sec.length>1?'s':'')+' ('+sec.slice(0,3).map(function(a){ return a.org; }).join(', ')+')');
  if(overdue.length)parts.push(overdue.length+' bill'+(overdue.length>1?'s':'')+' overdue or failed'+(sum(overdue)?' ('+money(sum(overdue))+')':'')+': '+overdue.slice(0,3).map(function(b){ return b.org; }).join(', '));
  if(due7.length)parts.push(due7.length+' due in the next 7 days'+(sum(due7)?' totalling '+money(sum(due7)):'')+': '+due7.slice(0,3).map(function(b){ return b.org+(b.amount!=null?' '+money(b.amount):''); }).join(', '));
  if(appts.length)parts.push(appts.length+' appointment'+(appts.length>1?'s':'')+': '+appts.slice(0,3).map(function(a){ return a.org+(a.when!=null?' on '+dpFmtDate(a.when,now):''); }).join(', '));
  var off=alerts.filter(function(a){ return a.cat==='official'; }); if(off.length)parts.push(off.length+' official notice'+(off.length>1?'s':'')+' ('+off.slice(0,3).map(function(a){ return a.org; }).join(', ')+')');
  var recap=parts.length?parts.join('. ')+'.':'Nothing needs your attention.';
  recap+=' '+noise+' promotional or newsletter message'+(noise===1?'':'s')+' set aside'+(other?', '+other+' ordinary':'')+'.';
  return {alerts:alerts,appointments:appts,bills:bills,receipts:receipts,noise:noise,other:other,recap:recap,total:items.length};
}

/* the next conversation down when the open one leaves the folder, the way a mail client reads */

  var rows=dpViewRows(DP.view), i=rows.findIndex(function(r){ return r.id===DP.view.thread; }), next=null;
  for(var k=i+1;k<rows.length;k++)if(ids.indexOf(rows[k].id)<0){ next=rows[k]; break; }
  if(!next)for(var j=i-1;j>=0;j--)if(ids.indexOf(rows[j].id)<0){ next=rows[j]; break; }
  if(next&&!DP.narrow())dpOpenThread(next.id); else dpCloseThread();
}
function dpDeleteForever(ids){
  if(!ids.length||!confirm('Delete '+ids.length+' item'+(ids.length>1?'s':'')+' permanently? This cannot be undone.'))return;
  dpPool(ids,3,function(id){ return dpGmDeleteThread(id).then(function(){ delete DP.threads[id]; dpDbDel('threads',id); }); }).then(function(){ DP.sel={}; dpCloseThread(); dpRenderList(); dpToast('Deleted permanently'); dpRefreshCounts(); });

  items.forEach(function(it){ if(it.sep){ m.appendChild(dpEl('hr')); return; }
    m.appendChild(dpEl('button.dp-mi',{type:'button',role:'menuitem',onclick:function(){ m.remove(); it.run(); }},[it.icon?dpIcon(it.icon,15):dpEl('span.dp-mi-gap'),dpEl('span',{text:it.label})])); });
  document.body.appendChild(m);

  m.style.left=Math.max(6,Math.min(r.left,innerWidth-w-6))+'px';
  m.style.top=(r.bottom+h+6>innerHeight?Math.max(6,r.top-h-4):r.bottom+4)+'px';
  setTimeout(function(){ var off=function(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('mousedown',off,true); document.removeEventListener('keydown',esc,true); } };
    var esc=function(e){ if(e.key==='Escape'){ m.remove(); document.removeEventListener('mousedown',off,true); document.removeEventListener('keydown',esc,true); } };
